<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Isaac Rogue</title>
    <style>
        body {
            background-color: #1a1515;
            color: #d9c3b0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            color: #9c2e2e;
            text-shadow: 2px 2px 0px #000;
            margin: 0 0 10px 0;
            font-size: 2.2rem;
            letter-spacing: 3px;
        }

        .game-wrapper {
            display: flex;
            gap: 20px;
            background: #2b2222;
            padding: 15px;
            border: 4px solid #000;
            box-shadow: 0px 0px 25px rgba(0,0,0,0.7);
            position: relative;
        }

        canvas {
            background-color: #140f0f;
            border: 4px solid #423535;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 180px;
            height: 480px;
        }

        .box {
            background: #1c1616;
            border: 2px solid #000;
            padding: 10px;
            text-align: center;
        }

        .box h2 {
            margin: 0 0 8px 0;
            font-size: 0.9rem;
            color: #9c2e2e;
            text-transform: uppercase;
        }

        .stat-line {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin: 4px 0;
        }

        .val {
            font-weight: bold;
            color: #fff;
        }

        .log-box {
            font-size: 0.75rem;
            color: #bfa38a;
            height: 100px;
            overflow-y: auto;
            text-align: left;
            line-height: 1.3;
            padding-right: 2px;
        }

        .log-box::-webkit-scrollbar {
            width: 4px;
        }
        .log-box::-webkit-scrollbar-thumb {
            background: #423535;
            border-radius: 2px;
        }

        .controls {
            font-size: 0.75rem;
            color: #8a7361;
            text-align: left;
            line-height: 1.4;
        }

        .back-btn {
            display: block;
            margin-top: 10px;
            background-color: #9c2e2e;
            color: #fff;
            text-decoration: none;
            padding: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
            border: 2px solid #000;
        }

        .back-btn:hover {
            background-color: #eee;
            color: #000;
        }
    </style>
</head>
<body>

    <h1>INFINITE BASEMENT</h1>

    <div class="game-wrapper">
        <!-- Main Game Viewport Layout -->
        <canvas id="isaacCanvas" width="640" height="480"></canvas>

        <!-- Sidebar Display Layout Dashboard Panels -->
        <div class="sidebar">
            <div class="box">
                <h2>Stats</h2>
                <div class="stat-line">Floor: <span id="statFloor" class="val">1</span></div>
                <div class="stat-line">Hearts: <span id="statHP" class="val">3/3</span></div>
                <div class="stat-line">Damage: <span id="statDMG" class="val">3.5</span></div>
                <div class="stat-line">Tear Rate: <span id="statFire" class="val">1.0</span></div>
                <div class="stat-line">Speed: <span id="statSpeed" class="val">3.5</span></div>
                <div class="stat-line" style="color: #ffd700; margin-top: 5px;">No-Hit Streak: <span id="statStreak" class="val">0/5</span></div>
            </div>

            <div class="box">
                <h2>Item Log</h2>
                <div id="itemLog" class="log-box">No items collected.</div>
            </div>

            <div class="box controls">
                <h2>Controls</h2>
                <div>WASD : Move Player</div>
                <div>Arrows : Shoot Tears</div>
                <a href="./index.html" class="back-btn">Hub Menu</a>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 👇 PART 2 BEGINS DIRECTLY BELOW THIS LINE 👇 -->
    <!-- ========================================== -->
<script>
    const canvas = document.getElementById('isaacCanvas');
    const ctx = canvas.getContext('2d');

    // 10 Distinct Stat-Modifying Items reference pool array
    const itemPool = [
        { id: 1, name: "The Sad Onion", desc: "Tears up (+0.4 Tear Rate)", color: "#00ffcc", mod: (p) => p.fireRate = Math.max(80, p.fireRate - 150) },
        { id: 2, name: "The Pact", desc: "Damage + Tears up (+1.0 DMG, +0.2 Fire Rate)", color: "#7a0099", mod: (p) => { p.damage += 1.0; p.fireRate = Math.max(80, p.fireRate - 80); } },
        { id: 3, name: "Magic Mushroom", desc: "All stats up! (+1.5 DMG, +1 Max HP, +1 Speed)", color: "#ff3333", mod: (p) => { p.damage += 1.5; p.maxHp += 1; p.hp += 1; p.speed += 1; } },
        { id: 4, name: "The Halo", desc: "All stats slightly up (+0.5 DMG, +50 Fire Rate, +0.5 Speed)", color: "#ffff99", mod: (p) => { p.damage += 0.5; p.fireRate = Math.max(80, p.fireRate - 50); p.speed += 0.5; } },
        { id: 5, name: "Pentagram", desc: "Damage up (+1.5 DMG)", color: "#ff0000", mod: (p) => p.damage += 1.5 },
        { id: 6, name: "Raw Liver", desc: "Health up (+2 Max HP fields)", color: "#994d00", mod: (p) => { p.maxHp += 2; p.hp += 2; } },
        { id: 7, name: "Spoon Bender", desc: "Homing Tears! (Stacking tracks tighter)", color: "#cc33ff", mod: (p) => p.homingLevel += 1 },
        { id: 8, name: "Ipecac", desc: "Explosive Tears! (Stacking blast radius splits)", color: "#339933", mod: (p) => { p.damage += 2.0; p.explosiveLevel += 1; p.fireRate += 100; } },
        { id: 9, name: "Wooden Spoon", desc: "Speed up (+1.5 Speed)", color: "#804000", mod: (p) => p.speed += 1.5 },
        { id: 10, name: "Breakfast", desc: "Health up (+1 Max HP container)", color: "#ffffff", mod: (p) => { p.maxHp += 1; p.hp += 1; } }
    ];

    // Legendary Champion Tier Streak Items
    const championItems = [
        { id: 11, name: "Brimstone", desc: "Blood Laser! (Quad DMG Beams)", color: "#222222", mod: (p) => { p.hasBrimstone = true; p.damage *= 2.5; p.fireRate = Math.max(400, p.fireRate * 1.5); } },
        { id: 12, name: "Soy Milk", desc: "Infinite Fire Rate! (DMG down)", color: "#fffff0", mod: (p) => { p.hasSoyMilk = true; p.fireRate = 45; p.damage *= 0.25; } }
    ];

    // Core global coordinates tracker structures
    let floorNumber = 1;
    let currentRoomX = 3; 
    let currentRoomY = 3;
    let roomGrid = [];     // Expanded to a 7x7 matrix to hold larger layout configurations

    const player = {
        x: canvas.width / 2, y: canvas.height / 2,
        r: 14, speed: 3.5,
        maxHp: 3, hp: 3,
        damage: 3.5, fireRate: 600, 
        tearRange: 250, lastShot: 0,
        homingLevel: 0, explosiveLevel: 0,
        hasBrimstone: false, hasSoyMilk: false // Champion status variables
    };

    // Damage-free milestone tracking parameters
    let damageTakenThisFloor = false;
    let flawlessFloorStreak = 0;

    let keys = {};
    let tears = [];
    let enemyProjectiles = []; // Ranged shooter projectile manager array
    let particles = [];
    let explosions = []; 

    let activeItemAlert = {
        visible: false, name: "", desc: "", displayStartTime: 0, duration: 1500 
    };

    // ==========================================
    // 👇 PART 3 BEGINS DIRECTLY BELOW THIS LINE 👇
    // ==========================================
    // PROCEDURAL GENERATOR: Snakes out 6-9 interconnected room matrices dynamically
    function generateFloor() {
        roomGrid = [];
        for (let y = 0; y < 7; y++) {
            roomGrid.push(new Array(7).fill(null));
        }

        // Lock anchor center position directly on a 7x7 matrix index row
        currentRoomX = 3;
        currentRoomY = 3;

        // Establish the start room
        roomGrid[currentRoomY][currentRoomX] = createRoom("Start");
        roomGrid[currentRoomY][currentRoomX].cleared = true;

        let roomPositions = [{y: currentRoomY, x: currentRoomX, type: "Start"}];
        let totalRoomsToSpawn = 5 + Math.floor(Math.random() * 4); // 6 to 9 rooms total

        // Snake generation loop
        while (roomPositions.length < totalRoomsToSpawn) {
            let parent = roomPositions[Math.floor(Math.random() * roomPositions.length)];
            let moves = [{y: -1, x: 0}, {y: 1, x: 0}, {y: 0, x: -1}, {y: 0, x: 1}];
            let pick = moves[Math.floor(Math.random() * moves.length)];
            
            let ny = parent.y + pick.y;
            let nx = parent.x + pick.x;

            // Keep rooms securely inside the matrix borders
            if (ny > 0 && ny < 6 && nx > 0 && nx < 6) {
                if (!roomGrid[ny][nx]) {
                    let type = "Monster"; // Default layout template type
                    let rmObj = {y: ny, x: nx, type: type};
                    roomPositions.push(rmObj);
                    roomGrid[ny][nx] = rmObj; // Temporary anchor holder tag
                }
            }
        }

        // Assign special rooms to extremes
        let endpoints = roomPositions.filter(p => p.type !== "Start");
        endpoints.sort(() => Math.random() - 0.5);

        // Enforce exact room assignments
        if (endpoints.length >= 2) {
            endpoints[0].type = "Boss";
            endpoints[1].type = "Item";
        }

        // Build rooms into functional structural arrays with door vectors
        for (let y = 0; y < 7; y++) {
            for (let x = 0; x < 7; x++) {
                if (roomGrid[y][x]) {
                    let finalType = roomGrid[y][x].type || "Monster";
                    roomGrid[y][x] = createRoom(finalType);
                }
            }
        }

        // Wire doorways between adjacent coordinates
        for (let y = 1; y < 6; y++) {
            for (let x = 1; x < 6; x++) {
                if (roomGrid[y][x]) {
                    if (roomGrid[y-1][x]) roomGrid[y][x].doors.top = true;
                    if (roomGrid[y+1][x]) roomGrid[y][x].doors.bottom = true;
                    if (roomGrid[y][x-1]) roomGrid[y][x].doors.left = true;
                    if (roomGrid[y][x+1]) roomGrid[y][x].doors.right = true;
                }
            }
        }
    }

    function createRoom(type) {
        let rm = {
            type: type, cleared: false,
            doors: { top: false, bottom: false, left: false, right: false },
            enemies: [], pedestals: [], trapdoors: [], heartPickups: []
        };

        if (type === "Monster") {
            let count = 2 + Math.floor(floorNumber * 0.4);
            for (let i = 0; i < count; i++) {
                let isChampion = Math.random() < 0.20; // 20% Elite variant roll chance
                let isRanged = Math.random() < 0.40;   // 40% Gopher ranged variation roll chance

                rm.enemies.push({
                    x: 120 + Math.random() * (canvas.width - 240),
                    y: 120 + Math.random() * (canvas.height - 240),
                    hp: (isRanged ? 5 : 8) + (floorNumber * 2), 
                    maxHp: (isRanged ? 5 : 8) + (floorNumber * 2),
                    r: isChampion ? 16 : 12, 
                    speed: (isChampion ? 1.6 : 1.1) + (Math.random() * 0.3), 
                    type: isRanged ? "Gopher Shooter" : "Fly",
                    color: isChampion ? "#00ffff" : "#cc3333", // Elite variants flash neon cyan
                    isChampion: isChampion,
                    isRanged: isRanged,
                    lastFired: 0
                });

                // Double elite health/damage adjustments
                if (isChampion) {
                    rm.enemies[rm.enemies.length - 1].hp *= 2;
                    rm.enemies[rm.enemies.length - 1].maxHp *= 2;
                }
            }
        } else if (type === "Boss") {
            rm.enemies.push({
                x: canvas.width / 2, y: canvas.height / 2,
                hp: 40 + (floorNumber * 20), maxHp: 40 + (floorNumber * 20),
                r: 28, speed: 1.0, type: "Monstro",
                color: "#9c2e2e", isBoss: true
            });
        } else if (type === "Item") {
            let itm = itemPool[Math.floor(Math.random() * itemPool.length)];
            rm.pedestals.push({ x: canvas.width / 2, y: canvas.height / 2, item: itm, collected: false });
        }
        return rm;
    }

    // Canvas background grid drawings
    function drawRoomBorders() {
        ctx.fillStyle = "#382e2e"; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#544646"; 
        ctx.fillRect(40, 40, canvas.width - 80, canvas.height - 80);

        ctx.strokeStyle = "#403535"; ctx.lineWidth = 2;
        for (let col = 1; col < 8; col++) {
            ctx.beginPath(); ctx.moveTo(col * 80, 40); ctx.lineTo(col * 80, canvas.height - 40); ctx.stroke();
        }
        for (let rw = 1; rw < 6; rw++) {
            ctx.beginPath(); ctx.moveTo(40, rw * 80); ctx.lineTo(canvas.width - 40, rw * 80); ctx.stroke();
        }
    }

    function drawDoors(rm) {
        ctx.fillStyle = "#1c1616";
        if (rm.doors.top) ctx.fillRect(canvas.width / 2 - 25, 20, 50, 20);
        if (rm.doors.bottom) ctx.fillRect(canvas.width / 2 - 25, canvas.height - 40, 50, 20);
        if (rm.doors.left) ctx.fillRect(20, canvas.height / 2 - 25, 20, 50);
        if (rm.doors.right) ctx.fillRect(canvas.width - 40, canvas.height / 2 - 25, 20, 50);
    }

    function checkDoorTransitions() {
        if (activeItemAlert.visible) return;
        let rm = roomGrid[currentRoomY][currentRoomX];
        if (!rm || !rm.cleared) return; 

        if (rm.doors.top && player.y <= 42 && Math.abs(player.x - canvas.width / 2) < 30) {
            currentRoomY--; player.y = canvas.height - 55; tears = []; enemyProjectiles = [];
        } else if (rm.doors.bottom && player.y >= canvas.height - 42 && Math.abs(player.x - canvas.width / 2) < 30) {
            currentRoomY++; player.y = 55; tears = []; enemyProjectiles = [];
        } else if (rm.doors.left && player.x <= 42 && Math.abs(player.y - canvas.height / 2) < 30) {
            currentRoomX--; player.x = canvas.width - 55; tears = []; enemyProjectiles = [];
        } else if (rm.doors.right && player.x >= canvas.width - 42 && Math.abs(player.y - canvas.height / 2) < 30) {
            currentRoomX++; player.x = 55; tears = []; enemyProjectiles = [];
        }
    }

    // ==========================================
    // 👇 PART 4 BEGINS DIRECTLY BELOW THIS LINE 👇
    // ==========================================
    // Processes shooting inputs and builds Brimstone beams or Soy Milk tear sprays
    function checkShooting(now) {
        if (activeItemAlert.visible) return; 

        let vx = 0, vy = 0;
        if (keys['ArrowLeft']) vx = -1;
        else if (keys['ArrowRight']) vx = 1;
        else if (keys['ArrowUp']) vy = -1;
        else if (keys['ArrowDown']) vy = 1;

        if (vx !== 0 || vy !== 0) {
            // BRIMSTONE BLOOD LASER MECHANICAL SYSTEM
            if (player.hasBrimstone) {
                if (now - player.lastShot > player.fireRate) {
                    // Fire a heavy line trace that spans the room across a vector direction
                    let laserBeam = {
                        startX: player.x, startY: player.y,
                        dirX: vx, dirY: vy,
                        damage: player.damage,
                        life: 15,
                        width: 14,
                        color: "#990000"
                    };
                    
                    // Instant hitscan test against enemies in the beam path line
                    let rm = roomGrid[currentRoomY][currentRoomX];
                    if (rm && rm.enemies) {
                        rm.enemies.forEach(e => {
                            let hit = false;
                            if (vx !== 0) {
                                let sameY = Math.abs(e.y - player.y) < (e.r + 5);
                                let rightDir = (vx > 0 && e.x > player.x) || (vx < 0 && e.x < player.x);
                                if (sameY && rightDir) hit = true;
                            } else if (vy !== 0) {
                                let sameX = Math.abs(e.x - player.x) < (e.r + 5);
                                let downDir = (vy > 0 && e.y > player.y) || (vy < 0 && e.y < player.y);
                                if (sameX && downDir) hit = true;
                            }
                            if (hit) {
                                e.hp -= player.damage;
                                for (let p = 0; p < 3; p++) {
                                    particles.push({
                                        x: e.x, y: e.y,
                                        vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4,
                                        life: 12, color: "#990000"
                                    });
                                }
                            }
                        });
                    }
                    player.lastShot = now;
                }
            } 
            // STANDARD TEARS / SOY MILK INFUSION SPRAY SYSTEM
            else if (now - player.lastShot > player.fireRate) {
                tears.push({
                    x: player.x, y: player.y,
                    vx: vx * 5.5, vy: vy * 5.5,
                    startX: player.x, startY: player.y,
                    damage: player.damage, r: player.explosiveLevel > 0 ? 8 : (player.hasSoyMilk ? 3 : 5), 
                    color: player.homingLevel > 0 ? "#cc33ff" : (player.explosiveLevel > 0 ? "#339933" : "#66ccff"),
                    isHoming: player.homingLevel > 0,
                    isExplosive: player.explosiveLevel > 0
                });
                player.lastShot = now;
            }
        }
    }

    // Creates an explosive radial ring dealing heavy AoE splash damage
    function createExplosion(x, y, level) {
        const radius = 40 + (level - 1) * 25;
        const damage = player.damage * 1.5;

        explosions.push({ x: x, y: y, currentR: 0, targetR: radius, life: 12 });

        let rm = roomGrid[currentRoomY][currentRoomX];
        if (rm && rm.enemies) {
            rm.enemies.forEach(e => {
                if (Math.hypot(e.x - x, e.y - y) < radius + e.r) {
                    e.hp -= damage; 
                }
            });
        }
    }

    // Main logic update and kinematic engine loop step
    function loopGame() {
        let now = performance.now();
        let rm = roomGrid[currentRoomY][currentRoomX];

        if (activeItemAlert.visible) {
            if (now - activeItemAlert.displayStartTime > activeItemAlert.duration) {
                activeItemAlert.visible = false;
            }
        }

        // Vector translation updates (freeze if picking up an item)
        if (!activeItemAlert.visible) {
            let mvx = 0, mvy = 0;
            if (keys['w'] || keys['W']) mvy = -1;
            if (keys['s'] || keys['S']) mvy = 1;
            if (keys['a'] || keys['A']) mvx = -1;
            if (keys['d'] || keys['D']) mvx = 1;

            player.x += mvx * player.speed;
            player.y += mvy * player.speed;
        }
        
        player.x = Math.max(30, Math.min(canvas.width - 30, player.x));
        player.y = Math.max(30, Math.min(canvas.height - 30, player.y));

        checkDoorTransitions();
        checkShooting(now);

        // Player Tear Movement & Collisions
        for (let i = tears.length - 1; i >= 0; i--) {
            let t = tears[i];

            if (t.isHoming && rm && rm.enemies && rm.enemies.length > 0) {
                let closestEnemy = null;
                let minDist = Infinity;
                rm.enemies.forEach(e => {
                    let d = Math.hypot(e.x - t.x, e.y - t.y);
                    if (d < minDist) { minDist = d; closestEnemy = e; }
                });

                if (closestEnemy) {
                    let angle = Math.atan2(closestEnemy.y - t.y, closestEnemy.x - t.x);
                    let strength = 0.05 * player.homingLevel;
                    t.vx = t.vx * (1 - strength) + Math.cos(angle) * 5.5 * strength;
                    t.vy = t.vy * (1 - strength) + Math.sin(angle) * 5.5 * strength;
                }
            }

            if (!activeItemAlert.visible) {
                t.x += t.vx; t.y += t.vy;
            }

            let hitSomething = false;
            let hitTargetX = t.x, hitTargetY = t.y;

            let dist = Math.hypot(t.x - t.startX, t.y - t.startY);
            if (dist > player.tearRange || t.x < 40 || t.x > canvas.width - 40 || t.y < 40 || t.y > canvas.height - 40) {
                hitSomething = true; tears.splice(i, 1);
            }

            if (!hitSomething && rm && rm.enemies) {
                for (let e of rm.enemies) {
                    if (Math.hypot(t.x - e.x, t.y - e.y) < t.r + e.r) {
                        e.hp -= t.damage; hitSomething = true;
                        hitTargetX = e.x; hitTargetY = e.y;

                        for (let p = 0; p < 4; p++) {
                            particles.push({
                                x: e.x, y: e.y, vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3, life: 15, color: "#990000"
                            });
                        }
                        tears.splice(i, 1); break;
                    }
                }
            }

            if (hitSomething && t.isExplosive) {
                createExplosion(hitTargetX, hitTargetY, player.explosiveLevel);
            }
        }
        // 3. Enemy Track AI Algorithms & Ranged Combat Systems
        if (rm && rm.enemies && !activeItemAlert.visible) {
            for (let i = rm.enemies.length - 1; i >= 0; i--) {
                let e = rm.enemies[i];
                if (e.hp <= 0) {
                    // 25% CHANCE RED HEART HEALTH DROP ON ROOM CLEAR
                    if (Math.random() < 0.25) {
                        rm.heartPickups.push({ x: e.x, y: e.y, r: 8 });
                    }
                    rm.enemies.splice(i, 1);
                    continue;
                }

                // AI Kinematics movement tracking vectors
                let angle = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(angle) * e.speed;
                e.y += Math.sin(angle) * e.speed;

                // GOPHER SHOOTER: Fire back toward the player's coordinate anchors
                if (e.isRanged && now - e.lastFired > 2000) {
                    enemyProjectiles.push({
                        x: e.x, y: e.y,
                        vx: Math.cos(angle) * 3.5, vy: Math.sin(angle) * 3.5,
                        r: 6, color: e.isChampion ? "#00ffff" : "#ff3300"
                    });
                    e.lastFired = now;
                }

                // Melee contact physical collision validation check
                if (Math.hypot(player.x - e.x, player.y - e.y) < player.r + e.r) {
                    player.hp = Math.max(0, player.hp - 0.5); 
                    damageTakenThisFloor = true; // Mark streak as broken instantly
                    updateStatsPanel();
                    
                    player.x += Math.cos(angle) * 15;
                    player.y += Math.sin(angle) * 15;

                    if (player.hp <= 0) { handleGameOver(); return; }
                }
            }
        }

        // Process enemy projectiles vectors trajectories
        for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
            let ep = enemyProjectiles[i];
            if (!activeItemAlert.visible) {
                ep.x += ep.vx; ep.y += ep.vy;
            }

            // Boundary cleanups
            if (ep.x < 40 || ep.x > canvas.width - 40 || ep.y < 40 || ep.y > canvas.height - 40) {
                enemyProjectiles.splice(i, 1);
                continue;
            }

            // Player projectile collision detection
            if (Math.hypot(player.x - ep.x, player.y - ep.y) < player.r + ep.r) {
                player.hp = Math.max(0, player.hp - 0.5);
                damageTakenThisFloor = true; // Break flawless streak tracking parameters
                updateStatsPanel();
                enemyProjectiles.splice(i, 1);

                if (player.hp <= 0) { handleGameOver(); return; }
            }
        }

        // Room clear state switches
        if (rm && rm.enemies.length === 0 && !rm.cleared) {
            rm.cleared = true;
            if (rm.type === "Boss") {
                rm.trapdoors.push({ x: canvas.width / 2, y: canvas.height / 2 });
            }
        }

        // 4. Red Heart Healing Pickup Collision Checks
        if (rm && rm.heartPickups && !activeItemAlert.visible) {
            for (let i = rm.heartPickups.length - 1; i >= 0; i--) {
                let h = rm.heartPickups[i];
                if (Math.hypot(player.x - h.x, player.y - h.y) < player.r + h.r) {
                    if (player.hp < player.maxHp) {
                        player.hp = Math.min(player.maxHp, player.hp + 0.5); // Heal half a heart
                        rm.heartPickups.splice(i, 1);
                        updateStatsPanel();
                    }
                }
            }
        }

        // 5. Item Pedestal Item Room Collisions Check
        if (rm && rm.pedestals && !activeItemAlert.visible) {
            for (let p of rm.pedestals) {
                if (!p.collected && Math.hypot(player.x - p.x, player.y - p.y) < player.r + 15) {
                    p.collected = true;
                    p.item.mod(player); 
                    
                    activeItemAlert.visible = true;
                    activeItemAlert.name = p.item.name.toUpperCase();
                    activeItemAlert.desc = p.item.desc;
                    activeItemAlert.displayStartTime = now;

                    let log = document.getElementById('itemLog');
                    if (log.innerText === "No items collected.") log.innerText = "";
                    log.innerHTML += `• <strong>${p.item.name}</strong><br><span style="color:#8a7361">${p.item.desc}</span><br>`;
                    log.scrollTop = log.scrollHeight;
                    updateStatsPanel();
                }
            }
        }
        // 6. FLAWLESS STREAK PROGRESS TRAPDOOR EVALUATION
        if (rm && rm.trapdoors && !activeItemAlert.visible) {
            for (let td of rm.trapdoors) {
                if (Math.hypot(player.x - td.x, td.y - player.y) < player.r + 16) {
                    floorNumber++;
                    
                    // Streak calculation logic filters
                    if (!damageTakenThisFloor) {
                        flawlessFloorStreak++;
                    } else {
                        flawlessFloorStreak = 0; // Reset back to zero on hit
                    }

                    // FLAWLESS STREAK REWARD: Spawns Brimstone or Soy Milk after 5 floors of no damage
                    if (flawlessFloorStreak >= 5) {
                        let legendary = championItems[Math.floor(Math.random() * championItems.length)];
                        
                        activeItemAlert.visible = true;
                        activeItemAlert.name = `CHAMPION UNLOCKED: ${legendary.name.toUpperCase()}`;
                        activeItemAlert.desc = legendary.desc;
                        activeItemAlert.displayStartTime = now;
                        activeItemAlert.duration = 3000; // Freeze message for 3 seconds

                        legendary.mod(player);

                        let log = document.getElementById('itemLog');
                        if (log.innerText === "No items collected.") log.innerText = "";
                        log.innerHTML += `★ <strong>${legendary.name}</strong><br><span style="color:#ffd700">${legendary.desc}</span><br>`;
                        log.scrollTop = log.scrollHeight;

                        flawlessFloorStreak = 0; // Cycle reset loops parameters
                    }

                    // Reset parameters for new layout configurations
                    damageTakenThisFloor = false;
                    generateFloor();
                    tears = []; enemyProjectiles = []; explosions = [];
                    updateStatsPanel();
                    alert(`Descended deeper into Floor ${floorNumber}. A large 6-9 room labyrinth has snaked out!`);
                }
            }
        }

        // Decay increment animation loops
        if (!activeItemAlert.visible) {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
            for (let i = explosions.length - 1; i >= 0; i--) {
                let exp = explosions[i];
                exp.currentR += (exp.targetR - exp.currentR) * 0.3; exp.life--;
                if (exp.life <= 0) explosions.splice(i, 1);
            }
        }

        // Render Canvas layers
        drawRoomBorders();
        if (rm) {
            drawDoors(rm);

            for (let td of rm.trapdoors) {
                ctx.fillStyle = "#000";
                ctx.beginPath(); ctx.arc(td.x, td.y, 16, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = "#423535"; ctx.lineWidth = 3; ctx.stroke();
            }

            // Render Red Heart Pickups
            for (let h of rm.heartPickups) {
                ctx.fillStyle = "#ff2222";
                ctx.beginPath(); ctx.arc(h.x - 3, h.y, h.r - 2, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(h.x + 3, h.y, h.r - 2, 0, Math.PI * 2); ctx.fill();
                ctx.fillRect(h.x - 5, h.y, 10, 5);
            }

            for (let p of rm.pedestals) {
                if (!p.collected) {
                    ctx.fillStyle = "#8c7a6b"; ctx.fillRect(p.x - 12, p.y + 2, 24, 14);
                    ctx.fillStyle = p.item.color; 
                    ctx.beginPath(); ctx.arc(p.x, p.y - 10 + Math.sin(now / 150) * 3, 10, 0, Math.PI * 2); ctx.fill();
                }
            }

            for (let e of rm.enemies) {
                ctx.fillStyle = e.color;
                ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
                
                // Render champion neon ring accents
                if (e.isChampion) {
                    ctx.strokeStyle = "#00ffff"; ctx.lineWidth = 1.5; ctx.stroke();
                }

                if (e.hp < e.maxHp) {
                    ctx.fillStyle = "#331a1a"; ctx.fillRect(e.x - 15, e.y - e.r - 10, 30, 4);
                    ctx.fillStyle = "#ff3333"; ctx.fillRect(e.x - 15, e.y - e.r - 10, Math.max(0, (e.hp / e.maxHp) * 30), 4);
                }
            }
        }

        for (let p of particles) {
            ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 3, 3);
        }

        for (let t of tears) {
            ctx.fillStyle = t.color; ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2); ctx.fill();
        }

        // Render Enemy Bullet Projectiles
        for (let ep of enemyProjectiles) {
            ctx.fillStyle = ep.color; ctx.beginPath(); ctx.arc(ep.x, ep.y, ep.r, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "#000"; ctx.lineWidth = 1; ctx.stroke();
        }

        for (let exp of explosions) {
            ctx.strokeStyle = "rgba(255, 100, 0, 0.6)"; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(exp.x, exp.y, exp.currentR, 0, Math.PI * 2); ctx.stroke();
            ctx.fillStyle = "rgba(255, 200, 0, 0.15)";
            ctx.beginPath(); ctx.arc(exp.x, exp.y, exp.currentR, 0, Math.PI * 2); fill();
        }

        // Render Player character avatar circle
        ctx.fillStyle = "#fce8d5"; ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#000"; ctx.fillRect(player.x - 7, player.y - 4, 3, 5); ctx.fillRect(player.x + 4, player.y - 4, 3, 5);
        ctx.fillStyle = "#66ccff"; ctx.fillRect(player.x - 7, player.y + 1, 2, 4); ctx.fillRect(player.x + 5, player.y + 1, 2, 4);

        // Flash Notification Item Banners
        if (activeItemAlert.visible) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.4)"; ctx.fillRect(40, 40, canvas.width - 80, canvas.height - 80);
            ctx.fillStyle = "rgba(28, 22, 22, 0.9)"; ctx.fillRect(40, canvas.height / 2 - 50, canvas.width - 80, 100);
            ctx.strokeStyle = "#9c2e2e"; ctx.lineWidth = 3; ctx.strokeRect(40, canvas.height / 2 - 50, canvas.width - 80, 100);
            ctx.fillStyle = "#fff"; ctx.font = "bold 1.3rem 'Courier New', monospace"; ctx.textAlign = "center";
            ctx.fillText(activeItemAlert.name, canvas.width / 2, canvas.height / 2 - 10);
            ctx.fillStyle = "#8a7361"; ctx.font = "0.95rem 'Courier New', monospace";
            ctx.fillText(activeItemAlert.desc, canvas.width / 2, canvas.height / 2 + 25);
        }

        requestAnimationFrame(loopGame);
    }

    function handleGameOver() {
        alert(`Run Ended in Basement Floor ${floorNumber}. Press OK to try again.`);
        floorNumber = 1; flawlessFloorStreak = 0; damageTakenThisFloor = false;
        player.maxHp = 3; player.hp = 3; player.damage = 3.5; player.fireRate = 600; player.speed = 3.5; player.tearRange = 250;
        player.homingLevel = 0; player.explosiveLevel = 0; player.hasBrimstone = false; player.hasSoyMilk = false;
        document.getElementById('itemLog').innerText = "No items collected.";
        generateFloor();
        updateStatsPanel();
        requestAnimationFrame(loopGame);
    }

    function updateStatsPanel() {
        document.getElementById('statFloor').innerText = floorNumber;
        document.getElementById('statHP').innerText = `${player.hp}/${player.maxHp}`;
        document.getElementById('statDMG').innerText = player.damage.toFixed(1);
        document.getElementById('statFire').innerText = (600 / player.fireRate).toFixed(1);
        document.getElementById('statSpeed').innerText = player.speed.toFixed(1);
        document.getElementById('statStreak').innerText = `${flawlessFloorStreak}/5`;
    }

    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    generateFloor();
    updateStatsPanel();
    requestAnimationFrame(loopGame);
</script>
</body>
</html>
