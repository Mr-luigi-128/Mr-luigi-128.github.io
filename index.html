<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Neon Tetris</title>
    <style>
        body {
            background-color: #111424;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            color: #00f0ff;
            text-shadow: 0 0 10px #00f0ff;
            margin-bottom: 20px;
        }

        .game-container {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            background: #1a1d36;
            padding: 20px;
            border-radius: 10px;
            border: 4px solid #ff007f;
            box-shadow: 0 0 20px #ff007f;
        }

        canvas {
            background-color: #0d0f1d;
            border: 2px solid #00f0ff;
            box-shadow: 0 0 10px #00f0ff;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 400px;
            min-width: 150px;
        }

        .box {
            background: #0d0f1d;
            border: 2px solid #ff007f;
            border-radius: 5px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 0 5px #ff007f;
        }

        .box h2 {
            margin: 0 0 10px 0;
            font-size: 1rem;
            color: #ff007f;
            text-transform: uppercase;
        }

        .score-val {
            font-size: 1.8rem;
            font-weight: bold;
            color: #00f0ff;
            text-shadow: 0 0 5px #00f0ff;
        }

        #previewCanvas {
            background-color: #0d0f1d;
            border: 1px solid #333;
            margin-top: 5px;
        }

        .controls {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #aaa;
            text-align: left;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>NEON TETRIS</h1>

    <div class="game-container">
        <!-- Main Game Board -->
        <canvas id="tetris" width="240" height="400"></canvas>

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="box">
                <h2>Score</h2>
                <div id="score" class="score-val">0</div>
            </div>

            <div class="box">
                <h2>Next</h2>
                <canvas id="previewCanvas" width="96" height="96"></canvas>
            </div>

            <div class="box controls">
                <h2>Controls</h2>
                <div>&larr; / &rarr; : Move</div>
                <div>&uarr; : Rotate</div>
                <div>&darr; : Soft Drop</div>
                <div>Space : Hard Drop</div>
            </div>
        </div>
    </div>

    <!-- JavaScript script tags will go directly here below -->
<script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    context.scale(20, 20); // Scales 1 unit in the matrix to a 20px grid tile

    const previewCanvas = document.getElementById('previewCanvas');
    const previewContext = previewCanvas.getContext('2d');
    previewContext.scale(24, 24); // Scales for the 4x4 sidebar preview window

    // Structural blueprints of the 7 classic Tetromino configurations
    function createPiece(type) {
        if (type === 'T') {
            return [,

            ];
        } else if (type === 'O') {
            return [,

            ];
        } else if (type === 'L') {
            return [,

        } else if (type === 'J') {
            return [,

        } else if (type === 'I') {
            return [,

            ];
        } else if (type === 'S') {
            return [,

 ,
            ];
        } else if (type === 'Z') {
            return [,
 ,
 ,
            ];
        }
    }

    // Color palettes mapped directly to the block indices above
    const colors = [
        null,
        '#ff007f', // 1: T - Neon Pink
        '#00f0ff', // 2: O - Neon Cyan
        '#ffb700', // 3: L - Neon Orange
        '#003cff', // 4: J - Neon Blue
        '#00ff66', // 5: I - Neon Green
        '#ff00ff', // 6: S - Neon Magenta
        '#ff3300'  // 7: Z - Neon Red
    ];

    // Grid matrix generator tracking game positions
    function createMatrix(w, h) {
        const matrix = [];
        while (h--) {
            matrix.push(new Array(w).fill(0));
        }
        return matrix;
    }

    // Neon grid boundary lines
    function drawGrid(ctx, w, h) {
        ctx.strokeStyle = '#181b32';
        ctx.lineWidth = 0.05;
        for (let i = 0; i < w; i++) {
            ctx.beginPath();
            ctx.moveTo(i, 0);
            ctx.lineTo(i, h);
            ctx.stroke();
        }
        for (let j = 0; j < h; j++) {
            ctx.beginPath();
            ctx.moveTo(0, j);
            ctx.lineTo(w, j);
            ctx.stroke();
        }
    }

    // Main grid pixel box drawing logic
    function drawMatrix(matrix, offset, ctx) {
        matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    ctx.fillStyle = colors[value];
                    ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                    
                    // Box inner reflection accent lines
                    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                    ctx.lineWidth = 0.05;
                    ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
                }
            });
        });
    }

    // Redraw loop execution framework
    function draw() {
        context.fillStyle = '#0d0f1d';
        context.fillRect(0, 0, canvas.width, canvas.height);

        drawGrid(context, 12, 20);
        drawMatrix(arena, {x: 0, y: 0}, context);
        drawMatrix(player.matrix, player.pos, context);
    }

    // Next piece dashboard display window loop
    function drawPreview() {
        previewContext.fillStyle = '#0d0f1d';
        previewContext.fillRect(0, 0, previewCanvas.width, previewCanvas.height);

        const nextMatrix = createPiece(nextPieceType);
        // Visual padding to center varying length shapes
        const offset = {
            x: (4 - nextMatrix.length) / 2,
            y: (4 - nextMatrix.length) / 2
        };
        
        drawMatrix(nextMatrix, offset, previewContext);
    }

    // Locks dynamic dropping matrix rows into permanent board bounds
    function merge(arena, player) {
        player.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    arena[y + player.pos.y][x + player.pos.x] = value;
                }
            });
        });
    }

    // Scans the playing field to purge completed horizontal point rows
    function arenaSweep() {
        let rowCount = 1;
        outer: for (let y = arena.length - 1; y > 0; --y) {
            for (let x = 0; x < arena[y].length; ++x) {
                if (arena[y][x] === 0) {
                    continue outer;
                }
            }
            const row = arena.splice(y, 1).fill(0);
            arena.unshift(row);
            ++y;

            player.score += rowCount * 10;
            rowCount *= 2;
        }
    }

    // Rigid object and side-wall edge collision checking algorithms
    function collide(arena, player) {
        const [m, o] = [player.matrix, player.pos];
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 &&
                   (arena[y + o.y] &&
                    arena[y + o.y][x + o.x]) !== 0) {
                    return true;
                }
            }
        }
        return false;
    }

    const arena = createMatrix(12, 20);

    const player = {
        pos: {x: 0, y: 0},
        matrix: null,
        score: 0,
    };

    let nextPieceType = '';

    function getRandomPieceType() {
        const pieces = 'ILJOZST'; // Explicitly set string character index entries 
        return pieces[pieces.length * Math.random() | 0];
    }

    // Spawns subsequent active puzzle piece items smoothly 
    function playerReset() {
        if (!nextPieceType) {
            nextPieceType = getRandomPieceType();
        }
        
        player.matrix = createPiece(nextPieceType);
        nextPieceType = getRandomPieceType();
        
        player.pos.y = 0;
        player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

        // Instant verification check for lose constraints
        if (collide(arena, player)) {
            alert("Game Over! Press OK to reset.");
            arena.forEach(row => row.fill(0));
            player.score = 0;
            updateScore();
        }
        
        drawPreview();
    }

    // Column offset displacement controller logic
    function playerMove(dir) {
        player.pos.x += dir;
        if (collide(arena, player)) {
            player.pos.x -= dir;
        }
    }

    // Rotates shape vectors over horizontal matrix cells
    function rotate(matrix, dir) {
        for (let y = 0; y < matrix.length; ++y) {
            for (let x = 0; x < y; ++x) {
                [
                    matrix[x][y],
                    matrix[y][x],
                ] = [
                    matrix[y][x],
                    matrix[x][y],
                ];
            }
        }
        if (dir > 0) {
            matrix.forEach(row => row.reverse());
        } else {
            matrix.reverse();
        }
    }

    // Wall-kick checks to keep rotated shapes inside bounds
    function playerRotate(dir) {
        const pos = player.pos.x;
        let offset = 1;
        rotate(player.matrix, dir);
        while (collide(arena, player)) {
            player.pos.x += offset;
            offset = -(offset + (offset > 0 ? 1 : -1));
            if (offset > player.matrix[0].length) {
                rotate(player.matrix, -dir);
                player.pos.x = pos;
                return;
            }
        }
    }

    // Standard baseline ticking vertical dropping logic frame loop
    function playerDrop() {
        player.pos.y++;
        if (collide(arena, player)) {
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            updateScore();
        }
        dropCounter = 0;
    }

    // Snap drops piece instantly using the spacebar key mapping
    function playerHardDrop() {
        while (!collide(arena, player)) {
            player.pos.y++;
        }
        player.pos.y--; 
        merge(arena, player);
        playerReset();
        arenaSweep();
        updateScore();
        dropCounter = 0;
    }

    function updateScore() {
        document.getElementById('score').innerText = player.score;
    }

    let dropCounter = 0;
    let dropInterval = 1000; // Drop step speed set at 1 second intervals initially
    let lastTime = 0;

    // Realtime canvas animation render engine
    function update(time = 0) {
        const deltaTime = time - lastTime;
        lastTime = time;

        dropCounter += deltaTime;
        if (dropCounter > dropInterval) {
            playerDrop();
        }

        draw();
        requestAnimationFrame(update);
    }

    // Global keyboard control layout hooks
    document.addEventListener('keydown', event => {
        if (event.key === 'ArrowLeft') {
            playerMove(-1);
        } else if (event.key === 'ArrowRight') {
            playerMove(1);
        } else if (event.key === 'ArrowDown') {
            playerDrop();
        } else if (event.key === 'ArrowUp') {
            playerRotate(1);
        } else if (event.key === ' ') {
            event.preventDefault(); // Prevents web-browser frame scrolling default loops
            playerHardDrop();
        }
    });

    // Run Engine
    playerReset();
    updateScore();
    update();
</script>


</body>
</html>
