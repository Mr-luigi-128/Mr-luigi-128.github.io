<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>128</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #f0f0f0;
            color: #333;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            font-size: 2.8rem;
            letter-spacing: 2px;
            margin: 0 0 10px 0;
            text-align: center;
        }

        p.subtitle {
            color: #666;
            margin: 0 0 40px 0;
            font-size: 1.1rem;
            text-align: center;
        }

        .arcade-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 950px;
            width: 100%;
        }

        .game-card {
            background: #fff;
            border: 2px solid #333;
            box-shadow: 5px 5px 0px #888;
            padding: 25px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 220px;
        }

        .game-card h2 {
            margin: 0 0 12px 0;
            font-size: 1.6rem;
            text-transform: uppercase;
        }

        .game-card p {
            color: #555;
            font-size: 0.95rem;
            line-height: 1.5;
            margin: 0 0 20px 0;
        }

        .play-btn {
            display: block;
            background-color: #333;
            color: #fff;
            text-decoration: none;
            padding: 12px 20px;
            font-weight: bold;
            text-transform: uppercase;
            border: 2px solid #333;
            letter-spacing: 1px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .play-btn:hover {
            background-color: #eee;
            color: #333;
        }

        /* Locked states for future projects */
        .locked {
            opacity: 0.5;
            border-style: dashed;
            background: #fafafa;
            box-shadow: none;
        }
        .locked .play-btn {
            background-color: #ccc;
            border-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

        <div class="game-card">
