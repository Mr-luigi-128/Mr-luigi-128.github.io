<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <style>
        body {
            background-color: #f0f0f0;
            color: #333;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5rem;
            letter-spacing: 2px;
        }

        .game-container {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            background: #fff;
            padding: 20px;
            border: 2px solid #333;
            box-shadow: 5px 5px 0px #888;
        }

        canvas {
            background-color: #111;
            border: 4px solid #333;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 400px;
            min-width: 140px;
        }

        .box {
            background: #eee;
            border: 2px solid #333;
            padding: 15px;
            text-align: center;
        }

        .box h2 {
            margin: 0 0 10px 0;
            font-size: 1rem;
            color: #333;
            text-transform: uppercase;
        }

        .score-val {
            font-size: 1.8rem;
            font-weight: bold;
            color: #111;
        }

        #previewCanvas {
            background-color: #111;
            border: 2px solid #333;
            margin-top: 5px;
        }

        .controls {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #555;
            text-align: left;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>TETRIS</h1>

    <div class="game-container">
        <!-- Main Game Board -->
        <canvas id="tetris" width="240" height="400"></canvas>

        <!-- Sidebar Display Layout -->
        <div class="sidebar">
            <div class="box">
                <h2>Score</h2>
                <div id="score" class="score-val">0</div>
            </div>

            <div class="box">
                <h2>Next</h2>
                <canvas id="previewCanvas" width="96" height="96"></canvas>
            </div>

            <div class="box controls">
                <h2>Controls</h2>
                <div>&larr; / &rarr; : Move</div>
                <div>&uarr; : Rotate</div>
                <div>&darr; : Soft Drop</div>
                <div>Space : Hard Drop</div>
            </div>
        </div>
    </div>
<script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    context.scale(20, 20); 

    const previewCanvas = document.getElementById('previewCanvas');
    const previewContext = previewCanvas.getContext('2d');
    previewContext.scale(24, 24); 

    // Robust blueprint matrix generator using clean visual string definitions
    function createPiece(type) {
        let definition = '';
        if (type === 'T') {
            definition = '010|111|000';
        } else if (type === 'O') {
            definition = '22|22';
        } else if (type === 'L') {
            definition = '003|333|000';
        } else if (type === 'J') {
            definition = '400|444|000';
        } else if (type === 'I') {
            definition = '0000|5555|0000|0000';
        } else if (type === 'S') {
            definition = '066|660|000';
        } else if (type === 'Z') {
            definition = '770|077|000';
        }
        return definition.split('|').map(row => row.split('').map(Number));
    }

    // Classic solid retro palette colors
    const colors = [
        null,
        '#a500ff', // 1: T - Purple
        '#eeee00', // 2: O - Yellow
        '#ffaa00', // 3: L - Orange
        '#0055ff', // 4: J - Blue
        '#00ddff', // 5: I - Cyan
        '#00ff00', // 6: S - Green
        '#ff0000'  // 7: Z - Red
    ];

    function createMatrix(w, h) {
        const matrix = [];
        while (h--) {
            matrix.push(new Array(w).fill(0));
        }
        return matrix;
    }

    function drawGrid(ctx, w, h) {
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 0.05;
        for (let i = 0; i < w; i++) {
            ctx.beginPath();
            ctx.moveTo(i, 0);
            ctx.lineTo(i, h);
            ctx.stroke();
        }
        for (let j = 0; j < h; j++) {
            ctx.beginPath();
            ctx.moveTo(0, j);
            ctx.lineTo(w, j);
            ctx.stroke();
        }
    }

    function drawMatrix(matrix, offset, ctx) {
        matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    ctx.fillStyle = colors[value];
                    ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                    
                    // Traditional black retro block borders
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 0.08;
                    ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
                }
            });
        });
    }

    function draw() {
        context.fillStyle = '#111';
        context.fillRect(0, 0, canvas.width, canvas.height);

        drawGrid(context, 12, 20);
        drawMatrix(arena, {x: 0, y: 0}, context);
        drawMatrix(player.matrix, player.pos, context);
    }

    function drawPreview() {
        previewContext.fillStyle = '#111';
        previewContext.fillRect(0, 0, previewCanvas.width, previewCanvas.height);

        const nextMatrix = createPiece(nextPieceType);
        const offset = {
            x: (4 - nextMatrix.length) / 2,
            y: (4 - nextMatrix.length) / 2
        };
        
        drawMatrix(nextMatrix, offset, previewContext);
    }
    function merge(arena, player) {
        player.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    arena[y + player.pos.y][x + player.pos.x] = value;
                }
            });
        });
    }

    function arenaSweep() {
        let rowCount = 1;
        outer: for (let y = arena.length - 1; y > 0; --y) {
            for (let x = 0; x < arena[y].length; ++x) {
                if (arena[y][x] === 0) {
                    continue outer;
                }
            }
            const row = arena.splice(y, 1).fill(0);
            arena.unshift(row);
            ++y;

            player.score += rowCount * 10;
            rowCount *= 2;
        }
    }

    function collide(arena, player) {
        const [m, o] = [player.matrix, player.pos];
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 &&
                   (arena[y + o.y] &&
                    arena[y + o.y][x + o.x]) !== 0) {
                    return true;
                }
            }
        }
        return false;
    }

    const arena = createMatrix(12, 20);

    const player = {
        pos: {x: 0, y: 0},
        matrix: null,
        score: 0,
    };

    let nextPieceType = '';

    function getRandomPieceType() {
        const pieces = 'ILJOZST';
        return pieces[pieces.length * Math.random() | 0];
    }

    function playerReset() {
        if (!nextPieceType) {
            nextPieceType = getRandomPieceType();
        }
        
        player.matrix = createPiece(nextPieceType);
        nextPieceType = getRandomPieceType();
        
        player.pos.y = 0;
        player.pos.x = (arena.length / 2 | 0) - (player.matrix.length / 2 | 0);

        if (collide(arena, player)) {
            alert("Game Over! Press OK to reset.");
            arena.forEach(row => row.fill(0));
            player.score = 0;
            updateScore();
        }
        
        drawPreview();
    }

    function playerMove(dir) {
        player.pos.x += dir;
        if (collide(arena, player)) {
            player.pos.x -= dir;
        }
    }

    function rotate(matrix, dir) {
        for (let y = 0; y < matrix.length; ++y) {
            for (let x = 0; x < y; ++x) {
                [
                    matrix[x][y],
                    matrix[y][x],
                ] = [
                    matrix[y][x],
                    matrix[x][y],
                ];
            }
        }
        if (dir > 0) {
            matrix.forEach(row => row.reverse());
        } else {
            matrix.reverse();
        }
    }

    function playerRotate(dir) {
        const pos = player.pos.x;
        let offset = 1;
        rotate(player.matrix, dir);
        while (collide(arena, player)) {
            player.pos.x += offset;
            offset = -(offset + (offset > 0 ? 1 : -1));
            if (offset > player.matrix.length) {
                rotate(player.matrix, -dir);
                player.pos.x = pos;
                return;
            }
        }
    }

    function playerDrop() {
        player.pos.y++;
        if (collide(arena, player)) {
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            updateScore();
        }
        dropCounter = 0;
    }

    function playerHardDrop() {
        while (!collide(arena, player)) {
            player.pos.y++;
        }
        player.pos.y--; 
        merge(arena, player);
        playerReset();
        arenaSweep();
        updateScore();
        dropCounter = 0;
    }

    function updateScore() {
        document.getElementById('score').innerText = player.score;
    }

    let dropCounter = 0;
    let dropInterval = 1000; 
    let lastTime = 0;

    function update(time = 0) {
        const deltaTime = time - lastTime;
        lastTime = time;

        dropCounter += deltaTime;
        if (dropCounter > dropInterval) {
            playerDrop();
        }

        draw();
        requestAnimationFrame(update);
    }

    document.addEventListener('keydown', event => {
        if (event.key === 'ArrowLeft') {
            playerMove(-1);
        } else if (event.key === 'ArrowRight') {
            playerMove(1);
        } else if (event.key === 'ArrowDown') {
            playerDrop();
        } else if (event.key === 'ArrowUp') {
            playerRotate(1);
        } else if (event.key === ' ') {
            event.preventDefault(); 
            playerHardDrop();
        }
    });

    playerReset();
    updateScore();
    update();
</script>
</body>
</html>
