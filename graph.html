<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Turbo</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;

    margin:0;
    width:100%;
    height:100%;

<body>

<canvas id="screen"></canvas>

<div id="info">
    <div id="name">TURBO</div>
    <div id="round">1 / 3</div>
    <div id="rank">1st</div>
    <div id="velocity">0 km/h</div>
    <div id="slot">?</div>
    <div id="notice"></div>
</div>

<div id="welcome">
    <h1>TURBO</h1>
    <p>
        Use W A S D or the arrow keys.<br>
        Collect useful objects and pass over the bright strips.
    </p>
    <button id="begin">BEGIN</button>
</div>

<div id="touch">
    <div class="pad" id="l">◀</div>
    <div class="pad" id="u">▲</div>
    <div class="pad" id="d">▼</div>
    <div class="pad" id="r">▶</div>
</div>

<script>

const canvas=document.getElementById("screen");
const ctx=canvas.getContext("2d");

let width=innerWidth;
let height=innerHeight;

function resize(){
    width=canvas.width=innerWidth;
    height=canvas.height=innerHeight;
}

addEventListener("resize",resize);
resize();

let active=false;
let finished=false;
let count=0;

const rounds=3;
const length=24000;

const vehicle={
    x:0,
    z:0,
    velocity:0,
    limit:1,
    acceleration:.012,
    braking:.025,
    steering:.045,
    round:1,
    distance:0,
    object:null,
    boost:0
};

let vehicles=[];

const route=[];

for(let i=0;i<length;i+=200){

    let bend=0;
    let slope=0;

    if(i>1500&&i<4500)bend=.8;
    if(i>4500&&i<6500)bend=-1;
    if(i>7000&&i<9500)bend=1.3;
    if(i>10000&&i<12500)bend=-.7;
    if(i>13500&&i<16000)bend=1.7;
    if(i>16500&&i<19000)bend=-1.4;
    if(i>20000&&i<22000)bend=.8;

    if(i>3000&&i<5000)slope=.7;
    if(i>9000&&i<11500)slope=-.6;
    if(i>14000&&i<16500)slope=.9;
    if(i>18500&&i<21000)slope=-.8;

    route.push({
        z:i,
        bend:bend,
        slope:slope
    });
}

const objects=[];

for(let i=1000;i<length;i+=1450){

    objects.push({
        z:i,
        x:Math.random()*1.4-.7,
        type:Math.random()<.5?"🍌":"⚡",
        used:false
    });
}

const strips=[];

for(let i=2200;i<length;i+=4200){
    strips.push({
        z:i,
        x:0
    });
}

const shades=[
    "#ff3b30",
    "#35d04f",
    "#ffcc00",
    "#9b59ff",
    "#00bfff",
    "#ff6b35"
];

function createVehicles(){

    vehicles=[];

    for(let i=0;i<6;i++){

        vehicles.push({
            x:(i-2.5)*.28,
            z:500-i*180,
            velocity:.72+Math.random()*.13,
            round:1,
            distance:0,
            shade:shades[i],
            phase:Math.random()*10
        });
    }
}

const input={};

addEventListener("keydown",e=>{

    input[e.key.toLowerCase()]=true;

    if([
        "arrowup",
        "arrowdown",
        "arrowleft",
        "arrowright",
        " "
    ].includes(e.key.toLowerCase())){
        e.preventDefault();
    }

    if(e.key===" "&&vehicle.object){
        activate();
    }
});

addEventListener("keyup",e=>{
    input[e.key.toLowerCase()]=false;
});

function bindTouch(id,key){

    const element=document.getElementById(id);

    const down=e=>{
        e.preventDefault();
        input[key]=true;
    };

    const up=e=>{
        e.preventDefault();
        input[key]=false;
    };

    element.addEventListener("touchstart",down,{passive:false});
    element.addEventListener("touchend",up,{passive:false});
    element.addEventListener("touchcancel",up,{passive:false});
}

bindTouch("l","arrowleft");
bindTouch("r","arrowright");
bindTouch("u","arrowup");
bindTouch("d","arrowdown");

document.getElementById("begin").onclick=begin;

function begin(){

    document.getElementById("welcome").style.display="none";

    active=true;
    finished=false;

    vehicle.x=0;
    vehicle.z=0;
    vehicle.velocity=0;
    vehicle.round=1;
    vehicle.distance=0;
    vehicle.object=null;
    vehicle.boost=0;

    objects.forEach(x=>x.used=false);

    createVehicles();

    count=3;

    setTimeout(()=>count=2,1000);
    setTimeout(()=>count=1,2000);
    setTimeout(()=>count=0,3000);
}

function clamp(value,min,max){
    return Math.max(min,Math.min(max,value));
}

function wrap(value){

    value%=length;

    if(value<0)value+=length;

    return value;
}

function segment(value){

    return route[Math.floor(wrap(value)/200)]||route[0];
}

function updateVehicle(){

    const forward=input.arrowup||input.w;
    const back=input.arrowdown||input.s;
    const left=input.arrowleft||input.a;
    const right=input.arrowright||input.d;

    if(forward){
        vehicle.velocity+=vehicle.acceleration;
    }else{
        vehicle.velocity-=.006;
    }

    if(back){
        vehicle.velocity-=vehicle.braking;
    }

    vehicle.velocity=clamp(
        vehicle.velocity,
        0,
        vehicle.limit
    );

    let steer=0;

    if(left)steer-=vehicle.steering;
    if(right)steer+=vehicle.steering;

    vehicle.x+=steer*(.7+vehicle.velocity);

    vehicle.x=clamp(
        vehicle.x,
        -1.35,
        1.35
    );

    if(Math.abs(vehicle.x)>1.05){
        vehicle.velocity*=.97;
    }

    if(vehicle.boost>0){
        vehicle.velocity+=.025;
        vehicle.boost--;
    }

    vehicle.z+=vehicle.velocity*160;

    if(vehicle.z>=length){

        vehicle.z-=length;
        vehicle.round++;

        if(vehicle.round>rounds){
            finish();
        }
    }

    vehicle.distance=
        (vehicle.round-1)*length+
        vehicle.z;

    inspectObjects();
    inspectStrips();
}

function inspectObjects(){

    for(const object of objects){

        if(object.used)continue;

        const gap=
            Math.abs(wrap(vehicle.z-object.z));

        if(
            gap<180&&
            Math.abs(vehicle.x-object.x)<.35
        ){

            object.used=true;
            vehicle.object=object.type;
            showObject();
        }
    }
}

function showObject(){

    document.getElementById("slot").textContent=
        vehicle.object||"?";
}

function activate(){

    if(!vehicle.object)return;

    if(vehicle.object==="⚡"){
        vehicle.boost=80;
    }

    if(vehicle.object==="🍌"){

        for(const other of vehicles){

            const gap=
                Math.abs(
                    wrap(other.z-vehicle.z)
                );

            if(gap<900){
                other.velocity*=.75;
            }
        }
    }

    vehicle.object=null;

    showObject();
}

function inspectStrips(){

    for(const strip of strips){

        const gap=
            Math.abs(
                wrap(vehicle.z-strip.z)
            );

        if(
            gap<140&&
            Math.abs(vehicle.x-strip.x)<.4
        ){
            vehicle.boost=45;
        }
    }
}

function updateVehicles(){

    for(const other of vehicles){

        other.z+=other.velocity*150;

        other.phase+=.02;

        other.x+=Math.sin(other.phase)*.0015;

        other.x=clamp(
            other.x,
            -1,
            1
        );

        if(other.z>=length){

            other.z-=length;
            other.round++;
        }

        other.distance=
            (other.round-1)*length+
            other.z;
    }
}

function updateRank(){

    let rank=1;

    for(const other of vehicles){

        if(other.distance>vehicle.distance){
            rank++;
        }
    }

    const ending=
        rank===1?"st":
        rank===2?"nd":
        rank===3?"rd":"th";

    document.getElementById("rank").textContent=
        rank+ending;
}

function finish(){

    if(finished)return;

    finished=true;

    const notice=
        document.getElementById("notice");

    notice.innerHTML="🏆 FINISH!";
    notice.style.display="block";

    setTimeout(()=>{

        notice.innerHTML=
            "COMPLETE<br>"+
            "<span style='font-size:.35em'>Press R to restart</span>";

    },1200);
}

addEventListener("keydown",e=>{

    if(
        finished&&
        e.key.toLowerCase()==="r"
    ){
        begin();
        document.getElementById("notice").style.display="none";
    }
});

function sky(){

    const gradient=
        ctx.createLinearGradient(
            0,0,0,height
        );

    gradient.addColorStop(0,"#4bbcff");
    gradient.addColorStop(.55,"#b8edff");
    gradient.addColorStop(1,"#70d46a");

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,0,width,height
    );

    ctx.fillStyle="#fff3a0";

    ctx.beginPath();

    ctx.arc(
        width*.78,
        height*.18,
        Math.min(width,height)*.07,
        0,
        Math.PI*2
    );

    ctx.fill();

    cloud(width*.2,height*.18,1);
    cloud(width*.55,height*.12,.7);
    cloud(width*.85,height*.3,.8);
}

function cloud(x,y,s){

    ctx.fillStyle="rgba(255,255,255,.9)";

    ctx.beginPath();

    ctx.arc(x,y,25*s,0,Math.PI*2);
    ctx.arc(x+30*s,y-10*s,35*s,0,Math.PI*2);
    ctx.arc(x+70*s,y,25*s,0,Math.PI*2);

    ctx.fill();
}

function landscape(){

    const horizon=height*.43;

    ctx.fillStyle="#55bd4f";

    ctx.fillRect(
        0,
        horizon,
        width,
        height-horizon
    );

    for(let i=35;i>0;i--){

        const z=
            vehicle.z+i*180;

        const part=
            segment(z);

        const depth=
            1-i/35;

        const y=
            horizon+
            Math.pow(depth,2)*height*.57;

        const road=
            lerp(
                width*.035,
                width*.9,
                depth
            );

        const bend=
            part.bend*i*.006;

        const center=
            width/2+
            bend*width*depth;

        ctx.fillStyle=
            i%2===0
                ?"#555"
                :"#5d5d5d";

        ctx.beginPath();

        ctx.moveTo(
            center-road/2,
            y
        );

        ctx.lineTo(
            center+road/2,
            y
        );

        ctx.lineTo(
            center+road*.51,
            y+18
        );

        ctx.lineTo(
            center-road*.51,
            y+18
        );

        ctx.closePath();

        ctx.fill();

        const edge=
            Math.max(
                4,
                road*.035
            );

        ctx.fillStyle=
            Math.floor(i/2)%2===0
                ?"#fff"
                :"#e93636";

        ctx.fillRect(
            center-road/2-edge,
            y,
            edge,
            18
        );

        ctx.fillRect(
            center+road/2,
            y,
            edge,
            18
        );

        if(i%6===0){

            ctx.fillStyle="#fff";

            ctx.fillRect(
                center-road*.008,
                y,
                Math.max(2,road*.016),
                Math.max(2,road*.04)
            );
        }
    }
}

function scenery(){

    for(let i=0;i<35;i++){

        const z=
            vehicle.z+
            i*750+
            500;

        const distance=
            wrap(z-vehicle.z);

        if(distance>10000)continue;

        const depth=
            1-distance/10000;

        const part=segment(z);

        const bend=
            part.bend*
            distance*
            .002;

        const center=
            width/2+bend*width;

        const side=
            i%2===0?-1:1;

        const x=
            center+
            side*
            (width*(.25+depth*.35));

        const y=
            height*.43+
            depth*height*.5;

        const size=
            10+depth*55;

        ctx.fillStyle="#70421e";

        ctx.fillRect(
            x-size*.1,
            y-size*.55,
            size*.2,
            size*.6
        );

        ctx.fillStyle=
            i%3===0
                ?"#218c3a"
                :"#2eaa45";

        ctx.beginPath();

        ctx.arc(
            x,
            y-size*.65,
            size*.45,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}

function objectsDraw(){

    for(const object of objects){

        if(object.used)continue;

        const distance=
            wrap(object.z-vehicle.z);

        if(distance>6000)continue;

        const depth=
            1-distance/6000;

        if(depth<=0)continue;

        const part=segment(object.z);

        const bend=
            part.bend*
            distance*
            .002;

        const center=
            width/2+bend*width;

        const road=
            lerp(
                width*.05,
                width*.8,
                depth
            );

        const x=
            center+
            object.x*road;

        const y=
            height*.43+
            Math.pow(depth,2)*height*.54;

        const size=
            10+depth*35;

        ctx.fillStyle="#fff";

        ctx.fillRect(
            x-size/2,
            y-size,
            size,
            size
        );

        ctx.fillStyle=
            object.type==="⚡"
                ?"#36c7ff"
                :"#ffe600";

        ctx.font=
            `${size*.75}px Arial`;

        ctx.textAlign="center";

        ctx.fillText(
            object.type,
            x,
            y-size*.2
        );
    }
}

function otherVehicles(){

    for(const other of vehicles){

        let distance=
            wrap(other.z-vehicle.z);

        if(distance>length/2){
            distance-=length;
        }

        if(distance<80||distance>6000){
            continue;
        }

        const depth=
            1-distance/6000;

        if(depth<=0)continue;

        const part=segment(other.z);

        const bend=
            part.bend*
            distance*
            .002;

        const center=
            width/2+bend*width;

        const road=
            lerp(
                width*.05,
                width*.8,
                depth
            );

        const x=
            center+
            other.x*road;

        const y=
            height*.43+
            Math.pow(depth,2)*height*.54;

        drawVehicle(
            x,
            y,
            15+depth*50,
            other.shade
        );
    }
}

function ownVehicle(){

    drawVehicle(
        width/2+
        vehicle.x*
        width*.15,
        height*.82,
        65,
        "#ff3030"
    );

    if(vehicle.boost>0){

        ctx.fillStyle="#ffd000";

        ctx.beginPath();

        ctx.moveTo(
            width/2-15,
            height*.91
        );

        ctx.lineTo(
            width/2,
            height*.99
        );

        ctx.lineTo(
            width/2+15,
            height*.91
        );

        ctx.fill();
    }
}

function drawVehicle(x,y,size,shade){

    const w=size;
    const h=size*.65;

    ctx.fillStyle="rgba(0,0,0,.3)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+h*.3,
        w*.7,
        h*.25,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#171717";

    ctx.fillRect(
        x-w*.55,
        y-h*.1,
        w*.18,
        h*.65
    );

    ctx.fillRect(
        x+w*.37,
        y-h*.1,
        w*.18,
        h*.65
    );

    ctx.fillStyle=shade;

    ctx.beginPath();

    ctx.roundRect(
        x-w/2,
        y-h/2,
        w,
        h,
        h*.2
    );

    ctx.fill();

    ctx.fillStyle="#fff";

    ctx.fillRect(
        x-w*.38,
        y-h*.2,
        w*.76,
        h*.12
    );

    ctx.fillStyle="#ffd0a0";

    ctx.beginPath();

    ctx.arc(
        x,
        y-h*.65,
        h*.32,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle=shade;

    ctx.beginPath();

    ctx.arc(
        x,
        y-h*.72,
        h*.34,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();
}

function stripsDraw(){

    for(const strip of strips){

        const distance=
            wrap(strip.z-vehicle.z);

        if(distance>5000)continue;

        const depth=
            1-distance/5000;

        const part=segment(strip.z);

        const bend=
            part.bend*
            distance*
            .002;

        const center=
            width/2+bend*width;

        const road=
            lerp(
                width*.04,
                width*.7,
                depth
            );

        const y=
            height*.43+
            Math.pow(depth,2)*height*.54;

        ctx.fillStyle="#00d9ff";

        ctx.beginPath();

        ctx.moveTo(
            center-road*.2,
            y
        );

        ctx.lineTo(
            center+road*.2,
            y
        );

        ctx.lineTo(
            center+road*.27,
            y+10
        );

        ctx.lineTo(
            center-road*.27,
            y+10
        );

        ctx.closePath();

        ctx.fill();

        ctx.fillStyle="#fff";

        ctx.font=
            `${Math.max(8,road*.12)}px Arial`;

        ctx.textAlign="center";

        ctx.fillText(
            "⚡",
            center,
            y+8
        );
    }
}

function countdown(){

    if(count<=0)return;

    ctx.fillStyle="rgba(0,0,0,.25)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    ctx.fillStyle=
        count===1
            ?"#38ff4b"
            :"#fff";

    ctx.font=
        `bold ${Math.min(width,height)*.2}px Arial`;

    ctx.textAlign="center";

    ctx.fillText(
        count,
        width/2,
        height/2
    );
}

function update(){

    if(!active||finished)return;

    if(count>0)return;

    updateVehicle();
    updateVehicles();
    updateRank();

    document.getElementById("round").textContent=
        `${Math.min(vehicle.round,rounds)} / ${rounds}`;

    document.getElementById("velocity").textContent=
        `${Math.round(vehicle.velocity*180)} km/h`;
}

function render(){

    sky();
    landscape();
    scenery();
    stripsDraw();
    objectsDraw();
    otherVehicles();
    ownVehicle();
    countdown();

    requestAnimationFrame(render);
}

function loop(){
    update();
    requestAnimationFrame(loop);
}

render();
loop();

</script>

</body>
</html>
