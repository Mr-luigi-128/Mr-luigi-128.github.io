<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>
    <style>
        body {
            background-color: #f0f0f0;
            color: #333;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5rem;
            letter-spacing: 2px;
        }

        .game-container {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            background: #fff;
            padding: 20px;
            border: 2px solid #333;
            box-shadow: 5px 5px 0px #888;
        }

        canvas {
            background-color: #111;
            border: 4px solid #333;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 400px;
            min-width: 140px;
        }

        .box {
            background: #eee;
            border: 2px solid #333;
            padding: 12px;
            text-align: center;
        }

        .box h2 {
            margin: 0 0 5px 0;
            font-size: 0.9rem;
            color: #333;
            text-transform: uppercase;
        }

        .score-val {
            font-size: 1.6rem;
            font-weight: bold;
            color: #111;
        }

        .controls {
            margin-top: auto;
            font-size: 0.8rem;
            color: #555;
            text-align: left;
            line-height: 1.4;
        }

        .back-btn {
            display: block;
            margin-top: 15px;
            background-color: #333;
            color: #fff;
            text-decoration: none;
            padding: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            border: 2px solid #333;
            transition: background 0.2s, color 0.2s;
        }

        .back-btn:hover {
            background-color: #eee;
            color: #333;
        }
    </style>
</head>
<body>

    <h1>SNAKE</h1>

    <div class="game-container">
        <!-- 400x400 playing grid (20x20 blocks at 20px size) -->
        <canvas id="snakeGame" width="400" height="400"></canvas>

        <!-- Sidebar Display Dashboard -->
        <div class="sidebar">
            <div class="box">
                <h2>Score</h2>
                <div id="score" class="score-val">0</div>
            </div>

            <div class="box">
                <h2>Length</h2>
                <div id="length" class="score-val">1</div>
            </div>

            <div class="box controls">
                <h2>Controls</h2>
                <div>&larr; : Move Left</div>
                <div>&rarr; : Move Right</div>
                <div>&uarr; : Move Up</div>
                <div>&darr; : Move Down</div>
                <!-- Back Link to Hub -->
                <a href="./index.html" class="back-btn">Hub Menu</a>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('snakeGame');
    const ctx = canvas.getContext('2d');

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    // Game variables
    let snake = [{ x: 10, y: 10 }];
    let food = { x: 5, y: 5 };
    let dx = 0;
    let dy = 0;
    let score = 0;
    let gameInterval;
    let currentSpeed = 150; // Starting speed (ms per tick)
    let nextDirection = { x: 0, y: 0 }; // Buffer to prevent self-collision on rapid clicks

    function gameLoop() {
        // Apply directional buffer update
        dx = nextDirection.x;
        dy = nextDirection.y;

        // Move head position vector matrix shifts
        const head = { x: snake[0].x + dx, y: snake[0].y + dy };

        // 1. Edge Wall Collisions Check
        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
            return gameOver();
        }

        // 2. Self Tail Collision Check (Only if moving)
        if (dx !== 0 || dy !== 0) {
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    return gameOver();
                }
            }
        }

        // Unshift head to advance body forward
        snake.unshift(head);

        // 3. Apple Consumption Evaluation
        if (head.x === food.x && head.y === food.y) {
            score += 10;
            document.getElementById('score').innerText = score;
            document.getElementById('length').innerText = snake.length;
            generateFood();
            accelerateGame();
        } else {
            // Remove tail tile if food wasn't consumed to simulate moving forward
            if (dx !== 0 || dy !== 0) {
                snake.pop();
            }
        }

        draw();
    }

    function draw() {
        // Clear background matrix layout grid bounds
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Render delicate retro layout square background grid gridlines
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 0.5;
        for (let i = 0; i < tileCount; i++) {
            ctx.beginPath();
            ctx.moveTo(i * gridSize, 0);
            ctx.lineTo(i * gridSize, canvas.height);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, i * gridSize);
            ctx.lineTo(canvas.width, i * gridSize);
            ctx.stroke();
        }

        // Render Snake blocks
        snake.forEach((part, index) => {
            // Distinct head styling
            ctx.fillStyle = index === 0 ? '#00ff00' : '#00aa00';
            ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
            
            // Traditional retro black brick border wrapping frame profiles
            ctx.strokeStyle = '#111';
            ctx.lineWidth = 2;
            ctx.strokeRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
        });

        // Render target Food apple block
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
        ctx.strokeStyle = '#111';
        ctx.strokeRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
    }

    function generateFood() {
        let validLocation = false;
        while (!validLocation) {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            
            // Ensure food doesn't accidentally drop inside current snake nodes
            validLocation = true;
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === food.x && snake[i].y === food.y) {
                    validLocation = false;
                    break;
                }
            }
        }
    }

    function accelerateGame() {
        // Increase loop refresh ticks slightly (minimum speed wall clamped at 50ms intervals)
        clearInterval(gameInterval);
        currentSpeed = Math.max(150 - Math.floor(score / 30) * 10, 50);
        gameInterval = setInterval(gameLoop, currentSpeed);
    }

    function gameOver() {
        clearInterval(gameInterval);
        alert(`Game Over! Score: ${score}. Press OK to restart.`);
        
        // Reset metrics states
        snake = [{ x: 10, y: 10 }];
        dx = 0;
        dy = 0;
        nextDirection = { x: 0, y: 0 };
        score = 0;
        currentSpeed = 150;
        
        document.getElementById('score').innerText = score;
        document.getElementById('length').innerText = snake.length;
        generateFood();
        
        gameInterval = setInterval(gameLoop, currentSpeed);
    }

    // Input handlers
    document.addEventListener('keydown', event => {
        if (event.key === 'ArrowLeft' && dx === 0) {
            nextDirection = { x: -1, y: 0 };
        } else if (event.key === 'ArrowRight' && dx === 0) {
            nextDirection = { x: 1, y: 0 };
        } else if (event.key === 'ArrowUp' && dy === 0) {
            nextDirection = { x: 0, y: -1 };
        } else if (event.key === 'ArrowDown' && dy === 0) {
            nextDirection = { x: 0, y: 1 };
        }
    });

    // Run Engine
    generateFood();
    draw();
    gameInterval = setInterval(gameLoop, currentSpeed);
</script>
</body>
</html>
