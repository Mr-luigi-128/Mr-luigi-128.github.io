<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Turbo</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,Helvetica,sans-serif;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  background:#65b9ed;
}

#hud{
  position:fixed;
  inset:0;
  pointer-events:none;
  color:white;
  text-shadow:2px 2px 4px #000;
}

#top{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
}

.panel{
  min-width:88px;
  padding:7px 11px;
  border-radius:9px;
  background:rgba(0,0,0,.48);
  border:1px solid rgba(255,255,255,.2);
  text-align:center;
  font-weight:bold;
}

.small{
  display:block;
  font-size:10px;
  opacity:.7;
  letter-spacing:1px;
}

#notice{
  position:absolute;
  left:50%;
  top:18%;
  transform:translateX(-50%);
  font-size:34px;
  font-weight:900;
  text-align:center;
  opacity:0;
  transition:opacity .15s;
}

#welcome,
#finish{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.48);
  z-index:10;
}

.box{
  width:min(90%,520px);
  padding:30px;
  border-radius:22px;
  text-align:center;
  color:white;
  background:linear-gradient(180deg,#222d,#111f);
  border:2px solid #ffffff44;
  box-shadow:0 18px 60px #000b;
}

h1{
  margin:0 0 8px;
  font-size:58px;
  letter-spacing:7px;
  font-style:italic;
}

.box p{
  line-height:1.55;
  color:#ddd;
}

button{
  border:0;
  border-radius:12px;
  padding:14px 28px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  color:white;
  background:#e53935;
  box-shadow:0 5px 0 #8d1715;
}

button:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #8d1715;
}

#finish{
  display:none;
}

#touch{
  position:fixed;
  left:0;
  right:0;
  bottom:15px;
  display:flex;
  justify-content:space-between;
  padding:0 18px;
  pointer-events:none;
  z-index:5;
}

.touchGroup{
  display:flex;
  gap:10px;
  pointer-events:auto;
}

.touchBtn{
  width:65px;
  height:65px;
  border-radius:50%;
  background:#0008;
  border:2px solid #fff7;
  color:white;
  font-size:27px;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
}

@media(min-width:800px){
  #touch{display:none}
}

@media(max-width:600px){
  h1{font-size:43px}
  .panel{min-width:72px;padding:5px 7px}
  #notice{font-size:27px}
}
</style>
</head>

<body>

<canvas id="view"></canvas>

<div id="hud">
  <div id="top">
    <div class="panel">
      <span class="small">LAP</span>
      <span id="round">1 / 5</span>
    </div>

    <div class="panel">
      <span class="small">POSITION</span>
      <span id="rank">1 / 8</span>
    </div>

    <div class="panel">
      <span class="small">SPEED</span>
      <span id="velocity">0</span>
    </div>

    <div class="panel">
      <span class="small">ITEM</span>
      <span id="slot">—</span>
    </div>
  </div>

  <div id="notice"></div>
</div>

<div id="welcome">
  <div class="box">
    <h1>TURBO</h1>
    <p>
      A longer, faster course with sweeping bends,
      hills, scenery and multiple sections.
    </p>

    <p>
      <b>W / ↑</b> accelerate<br>
      <b>S / ↓</b> brake<br>
      <b>A / ←</b> steer left<br>
      <b>D / →</b> steer right<br>
      <b>SPACE</b> use item
    </p>

    <button id="begin">START</button>
  </div>
</div>

<div id="finish">
  <div class="box">
    <h1 id="finishTitle">FINISH</h1>
    <p id="finishText"></p>
    <button onclick="restart()">PLAY AGAIN</button>
  </div>
</div>

<div id="touch">
  <div class="touchGroup">
    <div class="touchBtn" data-key="left">◀</div>
    <div class="touchBtn" data-key="right">▶</div>
  </div>

  <div class="touchGroup">
    <div class="touchBtn" data-key="down">▼</div>
    <div class="touchBtn" data-key="up">▲</div>
  </div>
</div>

<script>
const canvas=document.getElementById("view");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let dpr=Math.min(devicePixelRatio||1,2);

function resize(){
  W=innerWidth;
  H=innerHeight;
  dpr=Math.min(devicePixelRatio||1,2);

  canvas.width=W*dpr;
  canvas.height=H*dpr;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

addEventListener("resize",resize);
resize();


/* ---------------------------
   COURSE
---------------------------- */

const TOTAL=5;
const TRACK=36000;
const SEGMENT=120;

const route=[];
const scenery=[];
const strips=[];
const objects=[];
const barriers=[];

function makeRoute(){

  route.length=0;

  for(let z=0;z<TRACK;z+=SEGMENT){

    const p=z/TRACK;
    let curve=0;
    let hill=0;

    /*
      Several long sections make the
      course feel considerably larger.
    */

    if(p<.08){
      curve=0;
      hill=Math.sin(p*25)*12;
    }
    else if(p<.18){
      curve=Math.sin(p*24)*1.4;
      hill=Math.sin(p*17)*22;
    }
    else if(p<.28){
      curve=-Math.sin((p-.18)*35)*2.1;
      hill=-Math.sin((p-.18)*22)*18;
    }
    else if(p<.39){
      curve=Math.sin(p*31)*1.7;
      hill=Math.sin(p*14)*28;
    }
    else if(p<.49){
      curve=-2.8+Math.sin(p*27)*.8;
      hill=-15+Math.sin(p*25)*10;
    }
    else if(p<.59){
      curve=3.2+Math.sin(p*20)*1.1;
      hill=Math.sin(p*18)*25;
    }
    else if(p<.70){
      curve=Math.sin(p*35)*2.4;
      hill=-Math.sin(p*21)*25;
    }
    else if(p<.81){
      curve=-3.5+Math.sin(p*19)*1.4;
      hill=Math.sin(p*15)*30;
    }
    else if(p<.91){
      curve=Math.sin(p*42)*1.9;
      hill=-Math.sin(p*18)*24;
    }
    else{
      curve=0;
      hill=Math.sin(p*30)*10;
    }

    route.push({
      z,
      curve,
      hill
    });
  }


  scenery.length=0;
  strips.length=0;
  objects.length=0;
  barriers.length=0;

  for(let i=0;i<route.length;i++){

    const z=i*SEGMENT;

    if(i%7===0){
      scenery.push({
        z:z+30,
        side:-1,
        type:Math.random()<.55?"tree":"sign",
        size:.8+Math.random()*.7
      });

      scenery.push({
        z:z+80,
        side:1,
        type:Math.random()<.55?"tree":"sign",
        size:.8+Math.random()*.7
      });
    }

    if(i%31===10 || i%31===11){
      strips.push({
        z:z,
        x:(Math.random()*1.3)-.65,
        width:.45
      });
    }

    if(i%43===18){
      objects.push({
        z:z,
        x:(Math.random()*1.4)-.7,
        type:"boost",
        used:false
      });
    }

    if(i%67===25){
      objects.push({
        z:z,
        x:(Math.random()*1.4)-.7,
        type:"banana",
        used:false
      });
    }

    if(i%13===0){
      barriers.push({z:z,side:-1});
      barriers.push({z:z+50,side:1});
    }
  }
}

makeRoute();


/* ---------------------------
   VEHICLES
---------------------------- */

const vehicle={
  x:0,
  z:0,
  speed:0,
  maxSpeed:1150,
  lap:1,
  total:0,
  boost:0,
  object:null,
  name:"YOU"
};

const vehicles=[];

function createVehicles(){

  vehicles.length=0;

  const colors=[
    "#e53935",
    "#1976d2",
    "#fbc02d",
    "#8e24aa",
    "#00897b",
    "#fb8c00",
    "#3949ab"
  ];

  for(let i=0;i<7;i++){

    vehicles.push({
      x:(i%3-1)*.38,
      z:220+i*170,
      speed:720+Math.random()*160,
      maxSpeed:850+Math.random()*180,
      color:colors[i],
      phase:Math.random()*10,
      wobble:Math.random()*3,
      lap:1
    });
  }
}

createVehicles();


/* ---------------------------
   INPUT
---------------------------- */

const keys={
  up:false,
  down:false,
  left:false,
  right:false,
  space:false
};

addEventListener("keydown",e=>{

  const k=e.key.toLowerCase();

  if(k==="w"||e.key==="ArrowUp")keys.up=true;
  if(k==="s"||e.key==="ArrowDown")keys.down=true;
  if(k==="a"||e.key==="ArrowLeft")keys.left=true;
  if(k==="d"||e.key==="ArrowRight")keys.right=true;

  if(e.code==="Space"){
    keys.space=true;
    e.preventDefault();
  }

  if(k==="r"&&finished)restart();
});

addEventListener("keyup",e=>{

  const k=e.key.toLowerCase();

  if(k==="w"||e.key==="ArrowUp")keys.up=false;
  if(k==="s"||e.key==="ArrowDown")keys.down=false;
  if(k==="a"||e.key==="ArrowLeft")keys.left=false;
  if(k==="d"||e.key==="ArrowRight")keys.right=false;

  if(e.code==="Space")keys.space=false;
});


document.querySelectorAll(".touchBtn").forEach(btn=>{

  const key=btn.dataset.key;

  const down=e=>{
    e.preventDefault();
    keys[key]=true;
  };

  const up=e=>{
    e.preventDefault();
    keys[key]=false;
  };

  btn.addEventListener("pointerdown",down);
  btn.addEventListener("pointerup",up);
  btn.addEventListener("pointercancel",up);
  btn.addEventListener("pointerleave",up);
});


/* ---------------------------
   STATE
---------------------------- */

let active=false;
let finished=false;
let countdown=0;
let last=performance.now();
let usedSpace=false;

document.getElementById("begin").onclick=begin;

function begin(){

  document.getElementById("welcome").style.display="none";

  restart();

  active=true;
  countdown=3;

  showNotice("3",900);

  setTimeout(()=>showNotice("2",700),900);
  setTimeout(()=>showNotice("1",700),1600);
  setTimeout(()=>showNotice("GO!",900),2300);
}

function restart(){

  vehicle.x=0;
  vehicle.z=0;
  vehicle.speed=0;
  vehicle.lap=1;
  vehicle.total=0;
  vehicle.boost=0;
  vehicle.object=null;

  finished=false;

  for(let i=0;i<vehicles.length;i++){

    vehicles[i].x=(i%3-1)*.38;
    vehicles[i].z=240+i*190;
    vehicles[i].speed=700+Math.random()*180;
    vehicles[i].lap=1;
  }

  for(const o of objects)o.used=false;

  document.getElementById("finish").style.display="none";
}

function showNotice(text,time){

  const n=document.getElementById("notice");

  n.textContent=text;
  n.style.opacity=1;

  clearTimeout(n.timer);

  n.timer=setTimeout(()=>{
    n.style.opacity=0;
  },time);
}


/* ---------------------------
   HELPERS
---------------------------- */

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}

function wrap(v,max){

  while(v<0)v+=max;
  while(v>=max)v-=max;

  return v;
}

function getSegment(z){

  return route[Math.floor(wrap(z,TRACK)/SEGMENT)%route.length];
}


/* ---------------------------
   MOVEMENT
---------------------------- */

function moveVehicle(dt){

  const acceleration=keys.up?1050:0;
  const braking=keys.down?1450:0;

  vehicle.speed+=acceleration*dt;
  vehicle.speed-=braking*dt;

  if(!keys.up && !keys.down){
    vehicle.speed-=270*dt;
  }

  if(vehicle.boost>0){
    vehicle.speed+=1450*dt;
    vehicle.boost-=dt;
  }

  vehicle.speed=clamp(vehicle.speed,0,vehicle.maxSpeed+420);


  let steer=0;

  if(keys.left)steer-=1;
  if(keys.right)steer+=1;

  const steerPower=
    (0.75+vehicle.speed/vehicle.maxSpeed*.8)*dt;

  vehicle.x+=steer*steerPower;

  /*
    Curves pull the vehicle slightly,
    making the route feel physical.
  */

  const segment=getSegment(vehicle.z);

  vehicle.x-=segment.curve*
             (vehicle.speed/vehicle.maxSpeed)*
             .00095*dt*60;


  /*
    Road limits
  */

  if(Math.abs(vehicle.x)>1.12){

    vehicle.speed-=900*dt;

    vehicle.x=clamp(vehicle.x,-1.35,1.35);
  }

  vehicle.x=clamp(vehicle.x,-1.25,1.25);

  vehicle.z+=vehicle.speed*dt;

  if(vehicle.z>=TRACK){

    vehicle.z-=TRACK;
    vehicle.lap++;

    if(vehicle.lap>TOTAL){
      complete();
    }
  }

  vehicle.total=
    (vehicle.lap-1)*TRACK+
    vehicle.z;
}


function moveOthers(dt){

  for(const v of vehicles){

    const target=
      .75+
      Math.sin(performance.now()*.0006+v.phase)*.18;

    if(v.speed<v.maxSpeed){
      v.speed+=500*dt;
    }

    v.speed=clamp(v.speed,500,v.maxSpeed);

    v.z+=v.speed*dt;

    if(v.z>=TRACK){

      v.z-=TRACK;
      v.lap++;
    }

    const seg=getSegment(v.z);

    v.x+=Math.sin(
      performance.now()*.001+
      v.wobble
    )*.0009;

    v.x-=seg.curve*.00015*dt*60;

    v.x=clamp(v.x,-.92,.92);
  }
}


/* ---------------------------
   OBJECTS
---------------------------- */

function checkObjects(){

  for(const o of objects){

    if(o.used)continue;

    let dz=o.z-vehicle.z;

    if(dz>TRACK/2)dz-=TRACK;
    if(dz<-TRACK/2)dz+=TRACK;

    if(Math.abs(dz)<85 &&
       Math.abs(o.x-vehicle.x)<.28){

      if(o.type==="boost"){

        vehicle.boost=1.8;
        showNotice("BOOST!",700);

      }else{

        vehicle.object="🍌";
        showNotice("ITEM!",700);
      }

      o.used=true;
    }
  }
}


function useObject(){

  if(vehicle.object==="🍌"){

    vehicle.object=null;

    const target=vehicles
      .filter(v=>Math.abs(v.z-vehicle.z)<700)
      .sort((a,b)=>Math.abs(a.z-vehicle.z)-Math.abs(b.z-vehicle.z))[0];

    if(target){

      target.speed*=.35;
      target.z-=250;
    }

    showNotice("THROWN!",600);
  }
}


/* ---------------------------
   POSITION
---------------------------- */

function updateRank(){

  const all=[
    {
      total:vehicle.total,
      you:true
    },
    ...vehicles.map(v=>({
      total:(v.lap-1)*TRACK+v.z
    }))
  ];

  all.sort((a,b)=>b.total-a.total);

  const pos=
    all.findIndex(x=>x.you)+1;

  document.getElementById("rank").textContent=
    pos+" / "+all.length;

  document.getElementById("round").textContent=
    Math.min(vehicle.lap,TOTAL)+" / "+TOTAL;

  document.getElementById("velocity").textContent=
    Math.round(vehicle.speed*.18);

  document.getElementById("slot").textContent=
    vehicle.object||"—";
}


/* ---------------------------
   FINISH
---------------------------- */

function complete(){

  if(finished)return;

  finished=true;
  active=false;

  const rank=
    document.getElementById("rank").textContent;

  document.getElementById("finishText").innerHTML=
    "You finished in <b>"+rank+"</b>.<br><br>"+
    "Press the button below to go again.";

  document.getElementById("finish").style.display="flex";
}


/* ---------------------------
   BACKGROUND
---------------------------- */

function drawBackground(){

  const sky=ctx.createLinearGradient(0,0,0,H);

  sky.addColorStop(0,"#45a9e8");
  sky.addColorStop(.52,"#9bdbf4");
  sky.addColorStop(.53,"#77c44e");
  sky.addColorStop(1,"#4e9e35");

  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);


  /*
    distant mountains
  */

  ctx.fillStyle="#609e80";

  ctx.beginPath();
  ctx.moveTo(0,H*.52);

  for(let x=0;x<=W;x+=40){

    const y=
      H*.42+
      Math.sin(x*.008)*35+
      Math.sin(x*.021)*22;

    ctx.lineTo(x,y);
  }

  ctx.lineTo(W,H*.65);
  ctx.lineTo(0,H*.65);
  ctx.closePath();
  ctx.fill();


  /*
    clouds
  */

  for(let i=0;i<5;i++){

    const x=
      ((i*310+performance.now()*.008)%
      (W+300))-150;

    const y=70+(i%3)*55;

    ctx.fillStyle="rgba(255,255,255,.8)";

    ctx.beginPath();
    ctx.arc(x,y,28,0,Math.PI*2);
    ctx.arc(x+35,y-12,36,0,Math.PI*2);
    ctx.arc(x+72,y,27,0,Math.PI*2);
    ctx.fill();
  }
}


/* ---------------------------
   ROAD
---------------------------- */

function drawRoad(){

  const horizon=H*.36;
  const bottom=H;
  const center=W/2;

  /*
    layered road slices
  */

  const slices=90;

  for(let i=0;i<slices;i++){

    const near=i/slices;
    const far=(i+1)/slices;

    const y1=horizon+
      Math.pow(near,1.75)*(bottom-horizon);

    const y2=horizon+
      Math.pow(far,1.75)*(bottom-horizon);

    const depth1=Math.pow(near,1.8);
    const depth2=Math.pow(far,1.8);

    const seg=getSegment(
      vehicle.z+
      (near-.03)*1900
    );

    const curve=seg.curve;

    const bend=
      curve*
      depth1*
      W*.22;

    const bend2=
      curve*
      depth2*
      W*.22;

    const road1=
      W*.08+
      depth1*W*.46;

    const road2=
      W*.08+
      depth2*W*.46;

    const cx1=center+bend;
    const cx2=center+bend2;

    /*
      grass
    */

    ctx.fillStyle=
      i%2 ? "#56a83c":"#4d9c35";

    ctx.fillRect(0,y1,W,y2-y1);


    /*
      road
    */

    ctx.fillStyle=
      i%2 ? "#555":"#505050";

    ctx.beginPath();

    ctx.moveTo(cx1-road1,y1);
    ctx.lineTo(cx1+road1,y1);
    ctx.lineTo(cx2+road2,y2);
    ctx.lineTo(cx2-road2,y2);

    ctx.closePath();
    ctx.fill();


    /*
      red/white edge strips
    */

    const edge1=road1*.085;
    const edge2=road2*.085;

    ctx.fillStyle=
      i%2 ? "#f6f6f6":"#d83232";

    ctx.beginPath();

    ctx.moveTo(cx1-road1,y1);
    ctx.lineTo(cx1-road1+edge1,y1);
    ctx.lineTo(cx2-road2+edge2,y2);
    ctx.lineTo(cx2-road2,y2);

    ctx.closePath();
    ctx.fill();

    ctx.beginPath();

    ctx.moveTo(cx1+road1-edge1,y1);
    ctx.lineTo(cx1+road1,y1);
    ctx.lineTo(cx2+road2,y2);
    ctx.lineTo(cx2+road2-edge2,y2);

    ctx.closePath();
    ctx.fill();


    /*
      centre markings
    */

    if(i%5===0){

      ctx.fillStyle="#eee";

      const mark1=road1*.025;
      const mark2=road2*.025;

      ctx.beginPath();

      ctx.moveTo(cx1-mark1,y1);
      ctx.lineTo(cx1+mark1,y1);
      ctx.lineTo(cx2+mark2,y2);
      ctx.lineTo(cx2-mark2,y2);

      ctx.closePath();
      ctx.fill();
    }
  }
}


/* ---------------------------
   BARRIERS
---------------------------- */

function drawBarriers(){

  const horizon=H*.36;
  const center=W/2;

  for(const b of barriers){

    let dz=b.z-vehicle.z;

    if(dz<0)dz+=TRACK;

    if(dz>2100)continue;

    const p=1-dz/2100;

    if(p<0)continue;

    const y=
      horizon+
      Math.pow(p,1.75)*(H-horizon);

    const scale=.15+p*1.2;

    const seg=getSegment(b.z);

    const cx=
      center+
      seg.curve*p*W*.22;

    const x=
      cx+
      b.side*
      (W*.08+p*W*.46);

    const w=18*scale;
    const h=24*scale;

    ctx.fillStyle="#ddd";

    ctx.fillRect(x-w/2,y-h,w,h);

    ctx.fillStyle="#d33";

    ctx.fillRect(
      x-w/2,
      y-h,
      w,
      h*.45
    );
  }
}


/* ---------------------------
   SCENERY
---------------------------- */

function drawScenery(){

  const horizon=H*.36;
  const center=W/2;

  for(const s of scenery){

    let dz=s.z-vehicle.z;

    if(dz<0)dz+=TRACK;

    if(dz>3000)continue;

    const p=1-dz/3000;

    const y=
      horizon+
      Math.pow(p,1.65)*(H-horizon);

    const seg=getSegment(s.z);

    const cx=
      center+
      seg.curve*p*W*.22;

    const x=
      cx+
      s.side*
      (W*.12+p*W*.54);

    const size=
      (9+p*48)*s.size;

    if(s.type==="tree"){

      ctx.fillStyle="#70452c";

      ctx.fillRect(
        x-size*.13,
        y-size*.7,
        size*.26,
        size*.75
      );

      ctx.fillStyle="#176d35";

      ctx.beginPath();
      ctx.arc(
        x,
        y-size*.95,
        size*.65,
        0,
        Math.PI*2
      );

      ctx.fill();

      ctx.fillStyle="#218844";

      ctx.beginPath();
      ctx.arc(
        x-size*.3,
        y-size*1.15,
        size*.5,
        0,
        Math.PI*2
      );

      ctx.arc(
        x+size*.35,
        y-size*1.12,
        size*.48,
        0,
        Math.PI*2
      );

      ctx.fill();

    }else{

      ctx.fillStyle="#fff";

      ctx.fillRect(
        x-size*.08,
        y-size*1.3,
        size*.16,
        size*1.3
      );

      ctx.fillStyle="#ffcc22";

      ctx.fillRect(
        x-size*.55,
        y-size*1.45,
        size*1.1,
        size*.45
      );
    }
  }
}


/* ---------------------------
   BOOST STRIPS
---------------------------- */

function drawStrips(){

  const horizon=H*.36;
  const center=W/2;

  for(const s of strips){

    let dz=s.z-vehicle.z;

    if(dz<0)dz+=TRACK;

    if(dz>1800)continue;

    const p=1-dz/1800;

    const y=
      horizon+
      Math.pow(p,1.8)*(H-horizon);

    const seg=getSegment(s.z);

    const cx=
      center+
      seg.curve*p*W*.22;

    const roadWidth=
      W*.08+p*W*.46;

    const x=
      cx+s.x*roadWidth;

    const width=
      Math.max(5,roadWidth*.22);

    const height=
      Math.max(3,14*p);

    ctx.fillStyle="#21dfff";

    ctx.fillRect(
      x-width/2,
      y-height,
      width,
      height
    );

    ctx.fillStyle="#fff";

    ctx.fillRect(
      x-width*.22,
      y-height,
      width*.44,
      height
    );
  }
}


/* ---------------------------
   COLLECTIBLES
---------------------------- */

function drawObjects(){

  const horizon=H*.36;
  const center=W/2;

  for(const o of objects){

    if(o.used)continue;

    let dz=o.z-vehicle.z;

    if(dz<0)dz+=TRACK;

    if(dz>1500)continue;

    const p=1-dz/1500;

    const y=
      horizon+
      Math.pow(p,1.75)*(H-horizon);

    const seg=getSegment(o.z);

    const cx=
      center+
      seg.curve*p*W*.22;

    const roadWidth=
      W*.08+p*W*.46;

    const x=
      cx+o.x*roadWidth;

    const size=10+p*28;

    ctx.font=size+"px Arial";
    ctx.textAlign="center";

    ctx.fillText(
      o.type==="boost"?"⚡":"🍌",
      x,
      y-size*.3
    );
  }
}


/* ---------------------------
   OTHER VEHICLES
---------------------------- */

function drawOthers(){

  for(const v of vehicles){

    let dz=v.z-vehicle.z;

    if(dz<0)dz+=TRACK;

    if(dz>1800)continue;

    const p=1-dz/1800;

    const horizon=H*.36;

    const y=
      horizon+
      Math.pow(p,1.75)*(H-horizon);

    const seg=getSegment(v.z);

    const cx=
      W/2+
      seg.curve*p*W*.22;

    const roadWidth=
      W*.08+p*W*.46;

    const x=
      cx+
      v.x*roadWidth;

    const scale=.15+p*.95;

    drawVehicle(x,y,scale,v.color);
  }
}


/* ---------------------------
   MAIN VEHICLE
---------------------------- */

function drawMain(){

  const x=
    W/2+
    vehicle.x*W*.32;

  const y=
    H*.82;

  drawVehicle(
    x,
    y,
    1.35,
    "#e53935",
    true
  );
}


function drawVehicle(x,y,scale,color,main=false){

  const w=48*scale;
  const h=72*scale;

  /*
    shadow
  */

  ctx.fillStyle="rgba(0,0,0,.38)";

  ctx.beginPath();

  ctx.ellipse(
    x,
    y+5*scale,
    w*.7,
    h*.2,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    wheels
  */

  ctx.fillStyle="#151515";

  ctx.fillRect(
    x-w*.58,
    y-h*.38,
    w*.23,
    h*.43
  );

  ctx.fillRect(
    x+w*.35,
    y-h*.38,
    w*.23,
    h*.43
  );


  /*
    body
  */

  ctx.fillStyle=color;

  ctx.beginPath();

  ctx.moveTo(x-w*.43,y);
  ctx.lineTo(x-w*.52,y-h*.55);
  ctx.quadraticCurveTo(
    x-w*.45,
    y-h*.88,
    x,
    y-h
  );

  ctx.quadraticCurveTo(
    x+w*.45,
    y-h*.88,
    x+w*.52,
    y-h*.55
  );

  ctx.lineTo(x+w*.43,y);

  ctx.closePath();
  ctx.fill();


  /*
    windscreen
  */

  ctx.fillStyle="#74d5ef";

  ctx.beginPath();

  ctx.moveTo(x-w*.28,y-h*.61);
  ctx.lineTo(x+w*.28,y-h*.61);
  ctx.lineTo(x+w*.22,y-h*.83);
  ctx.lineTo(x-w*.22,y-h*.83);

  ctx.closePath();
  ctx.fill();


  /*
    front highlight
  */

  ctx.fillStyle="#ffffff88";

  ctx.fillRect(
    x-w*.08,
    y-h*.28,
    w*.16,
    h*.18
  );


  /*
    boost flame
  */

  if(main && vehicle.boost>0){

    ctx.fillStyle="#ffca28";

    ctx.beginPath();

    ctx.moveTo(x-w*.25,y);
    ctx.lineTo(x-w*.08,y+28*scale);
    ctx.lineTo(x,y+12*scale);
    ctx.lineTo(x+w*.08,y+28*scale);
    ctx.lineTo(x+w*.25,y);

    ctx.closePath();
    ctx.fill();

    ctx.fillStyle="#fff";

    ctx.beginPath();

    ctx.moveTo(x-w*.08,y);
    ctx.lineTo(x,y+18*scale);
    ctx.lineTo(x+w*.08,y);

    ctx.closePath();
    ctx.fill();
  }
}


/* ---------------------------
   START COUNTDOWN
---------------------------- */

function drawCountdown(){

  if(countdown<=0)return;

  ctx.textAlign="center";

  ctx.font="900 80px Arial";

  ctx.fillStyle="#fff";

  ctx.fillText(
    Math.ceil(countdown),
    W/2,
    H*.43
  );
}


/* ---------------------------
   RENDER
---------------------------- */

function render(){

  ctx.clearRect(0,0,W,H);

  drawBackground();
  drawRoad();
  drawScenery();
  drawBarriers();
  drawStrips();
  drawObjects();
  drawOthers();
  drawMain();
  drawCountdown();
}


/* ---------------------------
   UPDATE
---------------------------- */

function update(dt){

  if(!active)return;

  if(countdown>0){
    countdown-=dt;
  }

  moveVehicle(dt);
  moveOthers(dt);
  checkObjects();
  updateRank();

  if(keys.space && !usedSpace){

    useObject();
    usedSpace=true;

  }

  if(!keys.space){
    usedSpace=false;
  }
}


/* ---------------------------
   LOOP
---------------------------- */

function loop(now){

  const dt=Math.min(
    .035,
    (now-last)/1000
  );

  last=now;

  update(dt);
  render();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);


/* ---------------------------
   START SCREEN PREVIEW
---------------------------- */

render();

</script>
</body>
