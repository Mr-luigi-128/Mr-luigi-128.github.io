<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Turbo</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;

    margin:0;

<body>

<canvas id="view"></canvas>

<div id="info">
    <div id="name">TURBO</div>
    <div id="round">Lap 1 / 3</div>
    <div id="rank">1st</div>
    <div id="velocity">0 km/h</div>
    <div id="slot">?</div>
</div>

<div id="notice"></div>

<div id="welcome">
    <h1>TURBO</h1>
    <p>
        Drive using <b>WASD</b> or the arrow keys.<br>
        Stay between the barriers, collect objects and use the bright strips.
    </p>
    <button id="begin">BEGIN</button>
</div>

<div id="touch">
    <div class="pad" id="left">◀</div>
    <div class="pad" id="up">▲</div>
    <div class="pad" id="down">▼</div>
    <div class="pad" id="right">▶</div>
</div>

<script>

const canvas=document.getElementById("view");
const ctx=canvas.getContext("2d");

let W=0;
let H=0;

function resize(){
    W=innerWidth;
    H=innerHeight;
    canvas.width=W;
    canvas.height=H;
}

addEventListener("resize",resize);
resize();

const TOTAL=3;
const TRACK=18000;
const SEGMENT=120;

let active=false;
let finished=false;
let countdown=0;

const vehicle={
    x:0,
    z:0,
    speed:0,
    maxSpeed:1,
    lap:1,
    total:0,
    boost:0,
    object:null
};

const vehicles=[];
const route=[];
const objects=[];
const strips=[];
const barriers=[];

const input={};

const shades=[
    "#ff4040",
    "#42dc5b",
    "#ffd21c",
    "#a66cff",
    "#31c9ff"
];

/* Route */

for(let i=0;i<TRACK;i+=SEGMENT){

    let bend=0;

    if(i<1800) bend=0;
    else if(i<3600) bend=.9;
    else if(i<5100) bend=-1.1;
    else if(i<7200) bend=0;
    else if(i<9300) bend=1.4;
    else if(i<11100) bend=-1.3;
    else if(i<13200) bend=0;
    else if(i<15000) bend=-1.6;
    else if(i<16800) bend=1.1;
    else bend=0;

    route.push({
        z:i,
        bend:bend
    });
}

/* Objects */

for(let i=700;i<TRACK;i+=1100){

    objects.push({
        z:i,
        x:(Math.random()*.9)-.45,
        type:Math.random()<.5?"⚡":"🍌",
        taken:false
    });
}

/* Bright strips */

for(let i=1500;i<TRACK;i+=3000){

    strips.push({
        z:i,
        x:0
    });
}

/* Side markers */

for(let i=0;i<TRACK;i+=360){

    barriers.push({
        z:i,
        side:i%720===0?-1:1
    });
}

/* Input */

addEventListener("keydown",e=>{

    input[e.key.toLowerCase()]=true;

    if([
        "arrowup",
        "arrowdown",
        "arrowleft",
        "arrowright",
        " "
    ].includes(e.key.toLowerCase())){
        e.preventDefault();
    }

    if(e.key===" "){
        useObject();
    }

    if(finished&&e.key.toLowerCase()==="r"){
        restart();
    }
});

addEventListener("keyup",e=>{
    input[e.key.toLowerCase()]=false;
});

/* Touch */

function touch(id,key){

    const el=document.getElementById(id);

    const down=e=>{
        e.preventDefault();
        input[key]=true;
    };

    const up=e=>{
        e.preventDefault();
        input[key]=false;
    };

    el.addEventListener("touchstart",down,{passive:false});
    el.addEventListener("touchend",up,{passive:false});
    el.addEventListener("touchcancel",up,{passive:false});
}

touch("left","arrowleft");
touch("right","arrowright");
touch("up","arrowup");
touch("down","arrowdown");

/* Start */

document.getElementById("begin").onclick=restart;

function restart(){

    document.getElementById("welcome").style.display="none";
    document.getElementById("notice").style.display="none";

    active=true;
    finished=false;

    vehicle.x=0;
    vehicle.z=0;
    vehicle.speed=0;
    vehicle.lap=1;
    vehicle.total=0;
    vehicle.boost=0;
    vehicle.object=null;

    objects.forEach(o=>o.taken=false);

    createVehicles();

    countdown=3;

    setTimeout(()=>countdown=2,1000);
    setTimeout(()=>countdown=1,2000);
    setTimeout(()=>countdown=0,3000);
}

/* Other vehicles */

function createVehicles(){

    vehicles.length=0;

    for(let i=0;i<5;i++){

        vehicles.push({
            x:(i-2)*.3,
            z:350-i*180,
            speed:.62+Math.random()*.12,
            lap:1,
            total:0,
            shade:shades[i],
            phase:Math.random()*20
        });
    }
}

/* Helpers */

function clamp(v,a,b){
    return Math.max(a,Math.min(b,v));
}

function wrap(v){

    v%=TRACK;

    if(v<0)v+=TRACK;

    return v;
}

function getSegment(z){
    return route[
        Math.floor(wrap(z)/SEGMENT)
    ]||route[0];
}

/* Vehicle movement */

function moveVehicle(){

    if(countdown>0)return;

    const forward=
        input.arrowup||
        input.w;

    const backward=
        input.arrowdown||
        input.s;

    const left=
        input.arrowleft||
        input.a;

    const right=
        input.arrowright||
        input.d;

    if(forward){
        vehicle.speed+=.014;
    }else{
        vehicle.speed-=.006;
    }

    if(backward){
        vehicle.speed-=.025;
    }

    if(vehicle.boost>0){
        vehicle.speed+=.025;
        vehicle.boost--;
    }

    vehicle.speed=clamp(
        vehicle.speed,
        0,
        vehicle.maxSpeed
    );

    const steering=
        .038+
        vehicle.speed*.025;

    if(left){
        vehicle.x-=steering;
    }

    if(right){
        vehicle.x+=steering;
    }

    /* Off-course slowdown */

    if(Math.abs(vehicle.x)>1){

        vehicle.speed-=.02;

    }

    /* Hard boundary */

    vehicle.x=clamp(
        vehicle.x,
        -1.38,
        1.38
    );

    vehicle.z+=vehicle.speed*145;

    if(vehicle.z>=TRACK){

        vehicle.z-=TRACK;
        vehicle.lap++;

        if(vehicle.lap>TOTAL){
            complete();
            return;
        }
    }

    vehicle.total=
        (vehicle.lap-1)*TRACK+
        vehicle.z;

    checkObjects();
    checkStrips();
}

/* Other movement */

function moveOthers(){

    if(countdown>0)return;

    for(const v of vehicles){

        v.z+=v.speed*145;

        v.phase+=.02;

        v.x+=Math.sin(v.phase)*.001;

        v.x=clamp(v.x,-1,1);

        if(v.z>=TRACK){

            v.z-=TRACK;
            v.lap++;
        }

        v.total=
            (v.lap-1)*TRACK+
            v.z;
    }
}

/* Objects */

function checkObjects(){

    for(const o of objects){

        if(o.taken)continue;

        let gap=Math.abs(o.z-vehicle.z);

        gap=Math.min(
            gap,
            TRACK-gap
        );

        if(
            gap<100&&
            Math.abs(o.x-vehicle.x)<.32
        ){

            o.taken=true;
            vehicle.object=o.type;

            document.getElementById("slot")
                .textContent=o.type;
        }
    }
}

function useObject(){

    if(!vehicle.object)return;

    if(vehicle.object==="⚡"){
        vehicle.boost=100;
    }

    if(vehicle.object==="🍌"){

        for(const v of vehicles){

            let gap=Math.abs(v.z-vehicle.z);

            gap=Math.min(
                gap,
                TRACK-gap
            );

            if(gap<800){
                v.speed*=.65;
            }
        }
    }

    vehicle.object=null;

    document.getElementById("slot")
        .textContent="?";
}

function checkStrips(){

    for(const s of strips){

        let gap=Math.abs(s.z-vehicle.z);

        gap=Math.min(
            gap,
            TRACK-gap
        );

        if(
            gap<90&&
            Math.abs(vehicle.x-s.x)<.42
        ){
            vehicle.boost=45;
        }
    }
}

/* Position */

function updateRank(){

    let rank=1;

    for(const v of vehicles){

        if(v.total>vehicle.total){
            rank++;
        }
    }

    const suffix=
        rank===1?"st":
        rank===2?"nd":
        rank===3?"rd":"th";

    document.getElementById("rank")
        .textContent=rank+suffix;

    document.getElementById("round")
        .textContent=
        "Lap "+
        Math.min(vehicle.lap,TOTAL)+
        " / "+
        TOTAL;

    document.getElementById("velocity")
        .textContent=
        Math.round(vehicle.speed*190)+
        " km/h";
}

/* Complete */

function complete(){

    finished=true;

    const n=document.getElementById("notice");

    n.innerHTML=
        "🏁 FINISH<br>"+
        "<span style='font-size:.35em'>Press R to restart</span>";

    n.style.display="block";
}

/* Background */

function drawBackground(){

    const sky=ctx.createLinearGradient(
        0,0,0,H
    );

    sky.addColorStop(0,"#38b9ff");
    sky.addColorStop(.55,"#b9edff");
    sky.addColorStop(.56,"#77d45d");
    sky.addColorStop(1,"#42a943");

    ctx.fillStyle=sky;
    ctx.fillRect(0,0,W,H);

    /* Sun */

    ctx.fillStyle="#fff4a2";

    ctx.beginPath();

    ctx.arc(
        W*.78,
        H*.17,
        Math.min(W,H)*.065,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* Clouds */

    drawCloud(W*.18,H*.18,1);
    drawCloud(W*.52,H*.11,.75);
    drawCloud(W*.86,H*.27,.8);
}

function drawCloud(x,y,s){

    ctx.fillStyle="rgba(255,255,255,.9)";

    ctx.beginPath();

    ctx.arc(x,y,28*s,0,Math.PI*2);
    ctx.arc(x+35*s,y-12*s,38*s,0,Math.PI*2);
    ctx.arc(x+75*s,y,28*s,0,Math.PI*2);

    ctx.fill();
}

/* Road */

function drawRoad(){

    const horizon=H*.40;

    const visible=80;

    let curve=0;

    for(let i=visible;i>=1;i--){

        const z=
            vehicle.z+
            i*SEGMENT;

        const s=getSegment(z);

        curve+=s.bend*.002;

        const depth=1-i/visible;

        const y=
            horizon+
            Math.pow(depth,1.9)*
            H*.62;

        const roadWidth=
            W*.045+
            depth*W*.86;

        const center=
            W/2+
            curve*
            W*
            depth;

        /* Grass stripes */

        ctx.fillStyle=
            i%2===0
                ?"#4eb84a"
                :"#55c650";

        ctx.fillRect(
            0,
            y,
            W,
            25
        );

        /* Road */

        ctx.fillStyle=
            i%2===0
                ?"#454545"
                :"#4c4c4c";

        ctx.beginPath();

        ctx.moveTo(
            center-roadWidth/2,
            y
        );

        ctx.lineTo(
            center+roadWidth/2,
            y
        );

        ctx.lineTo(
            center+roadWidth*.52,
            y+25
        );

        ctx.lineTo(
            center-roadWidth*.52,
            y+25
        );

        ctx.closePath();

        ctx.fill();

        /* Left edge */

        ctx.fillStyle=
            i%2===0
                ?"#fff"
                :"#ef3b3b";

        ctx.fillRect(
            center-roadWidth/2-8,
            y,
            8,
            25
        );

        /* Right edge */

        ctx.fillRect(
            center+roadWidth/2,
            y,
            8,
            25
        );

        /* Centre markings */

        if(i%5===0){

            ctx.fillStyle="#f7f7f7";

            ctx.fillRect(
                center-roadWidth*.012,
                y,
                roadWidth*.024,
                25
            );
        }
    }
}

/* Side markers */

function drawBarriers(){

    for(const b of barriers){

        let distance=
            wrap(b.z-vehicle.z);

        if(distance>6000)continue;

        const depth=
            1-distance/6000;

        if(depth<=0)continue;

        const s=getSegment(b.z);

        const bend=
            s.bend*
            distance*
            .002;

        const center=
            W/2+
            bend*W;

        const road=
            W*.05+
            depth*W*.86;

        const side=b.side;

        const x=
            center+
            side*
            (road/2+
            25+
            depth*45);

        const y=
            H*.40+
            Math.pow(depth,1.9)*H*.62;

        const size=
            8+depth*42;

        ctx.fillStyle="#fff";

        ctx.fillRect(
            x-size*.12,
            y-size,
            size*.24,
            size
        );

        ctx.fillStyle="#e93434";

        ctx.beginPath();

        ctx.arc(
            x,
            y-size,
            size*.32,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}

/* Bright strips */

function drawStrips(){

    for(const s of strips){

        let distance=
            wrap(s.z-vehicle.z);

        if(distance>5000)continue;

        const depth=
            1-distance/5000;

        const part=getSegment(s.z);

        const bend=
            part.bend*
            distance*
            .002;

        const center=
            W/2+bend*W;

        const road=
            W*.05+
            depth*W*.86;

        const y=
            H*.40+
            Math.pow(depth,1.9)*H*.62;

        ctx.fillStyle="#00d9ff";

        ctx.fillRect(
            center-road*.23,
            y,
            road*.46,
            12+depth*18
        );

        ctx.fillStyle="#fff";

        ctx.font=
            Math.max(10,depth*35)+
            "px Arial";

        ctx.textAlign="center";

        ctx.fillText(
            "⚡",
            center,
            y+Math.max(10,depth*30)
        );
    }
}

/* Objects */

function drawObjects(){

    for(const o of objects){

        if(o.taken)continue;

        let distance=
            wrap(o.z-vehicle.z);

        if(distance>5000)continue;

        const depth=
            1-distance/5000;

        const part=getSegment(o.z);

        const bend=
            part.bend*
            distance*
            .002;

        const center=
            W/2+bend*W;

        const road=
            W*.05+
            depth*W*.86;

        const x=
            center+
            o.x*road;

        const y=
            H*.40+
            Math.pow(depth,1.9)*H*.62;

        const size=
            10+depth*40;

        ctx.fillStyle=
            o.type==="⚡"
                ?"#26cfff"
                :"#ffd900";

        ctx.fillRect(
            x-size/2,
            y-size,
            size,
            size
        );

        ctx.strokeStyle="#fff";
        ctx.lineWidth=3;

        ctx.strokeRect(
            x-size/2,
            y-size,
            size,
            size
        );

        ctx.font=
            size*.7+
            "px Arial";

        ctx.textAlign="center";

        ctx.fillStyle="#fff";

        ctx.fillText(
            o.type,
            x,
            y-size*.2
        );
    }
}

/* Other vehicles */

function drawOthers(){

    for(const v of vehicles){

        let distance=
            wrap(v.z-vehicle.z);

        if(distance>TRACK/2){
            distance-=TRACK;
        }

        if(distance<100||distance>5000){
            continue;
        }

        const depth=
            1-distance/5000;

        const part=getSegment(v.z);

        const bend=
            part.bend*
            distance*
            .002;

        const center=
            W/2+bend*W;

        const road=
            W*.05+
            depth*W*.86;

        const x=
            center+
            v.x*road;

        const y=
            H*.40+
            Math.pow(depth,1.9)*H*.62;

        drawVehicle(
            x,
            y,
            15+depth*48,
            v.shade
        );
    }
}

/* Main vehicle */

function drawMain(){

    const x=
        W/2+
        vehicle.x*
        W*.18;

    const y=H*.80;

    drawVehicle(
        x,
        y,
        75,
        "#f22d32"
    );

    if(vehicle.boost>0){

        ctx.fillStyle="#ffd000";

        ctx.beginPath();

        ctx.moveTo(x-20,y+30);
        ctx.lineTo(x,y+75);
        ctx.lineTo(x+20,y+30);

        ctx.fill();

        ctx.fillStyle="#fff";

        ctx.beginPath();

        ctx.moveTo(x-7,y+31);
        ctx.lineTo(x,y+60);
        ctx.lineTo(x+7,y+31);

        ctx.fill();
    }
}

/* Vehicle */

function drawVehicle(x,y,size,color){

    const w=size;
    const h=size*.62;

    /* Shadow */

    ctx.fillStyle="rgba(0,0,0,.35)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+h*.42,
        w*.72,
        h*.24,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* Wheels */

    ctx.fillStyle="#111";

    ctx.fillRect(
        x-w*.55,
        y-h*.08,
        w*.2,
        h*.65
    );

    ctx.fillRect(
        x+w*.35,
        y-h*.08,
        w*.2,
        h*.65
    );

    /* Body */

    ctx.fillStyle=color;

    ctx.beginPath();

    ctx.roundRect(
        x-w*.5,
        y-h*.5,
        w,
        h,
        h*.2
    );

    ctx.fill();

    /* Front */

    ctx.fillStyle="#eee";

    ctx.fillRect(
        x-w*.35,
        y-h*.19,
        w*.7,
        h*.12
    );

    /* Head */

    ctx.fillStyle="#ffd0a0";

    ctx.beginPath();

    ctx.arc(
        x,
        y-h*.67,
        h*.32,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* Head covering */

    ctx.fillStyle=color;

    ctx.beginPath();

    ctx.arc(
        x,
        y-h*.73,
        h*.34,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();
}

/* Countdown */

function drawCountdown(){

    if(countdown<=0)return;

    ctx.fillStyle="rgba(0,0,0,.25)";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    ctx.fillStyle=
        countdown===1
            ?"lime"
            :"white";

    ctx.font=
        "bold "+
        Math.min(W,H)*.2+
        "px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        countdown,
        W/2,
        H/2
    );
}

/* Rendering */

function render(){

    drawBackground();
    drawRoad();
    drawBarriers();
    drawStrips();
    drawObjects();
    drawOthers();
    drawMain();
    drawCountdown();

    requestAnimationFrame(render);
}

/* Updating */

function update(){

    if(!active||finished){
        requestAnimationFrame(update);
        return;
    }

    moveVehicle();
    moveOthers();
    updateRank();

    requestAnimationFrame(update);
}

render();
update();

</script>

</body>
</html>
